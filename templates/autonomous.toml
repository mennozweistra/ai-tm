description = "For a project the creator will run largely unattended. The front of the ticket is done with the creator — a Discovery grill to settle requirements, then a technical specification drafted for review — and the creator's approval of that specification is the switch: only then does the autonomous run start, running Planning, Setup, Implementation, QA, and AI Review without pausing and stopping at Human Review. Once autonomous, the run never stops to ask about a judgment call: it decides, prefers the reversible option, and records the decision for review. It never performs an irreversible outward action (push, merge, deploy, delete, send, spend) on its own — such a step is left undone and flagged while the run continues. Work blocked on something missing from outside — a credential, a service, a dependency — is left undone with the reason recorded, and everything not depending on it still runs; supplying the missing thing and re-running resumes exactly there. A task that would require crossing the fixed safety line of forbidden actions is refused outright; the engine ends the run at that refusal, keeping everything completed and logged up to that point."
ai_description = "This template runs a ticket in two parts: a collaborative front done with the user, then an autonomous remainder. Do not blur them.\n\nCOLLABORATIVE FRONT (with the user, before autonomy is switched on): Discovery and Technical Specification. Run the Discovery grill as an interview with the user to settle requirements, and during Discovery also determine what support tooling the project needs for its QA checks (test runner, linter/formatter, static analysis or type checker) and capture any gap as a requirement, which the Setup phase later installs. Then draft the technical specification and refine it with the user. The user's agreement is recorded in two human approval tasks — one at the end of Discovery for the requirements, one at the end of the Technical Specification phase for the specification. The specification approval is the switch into the autonomous remainder; an unattended run that reaches either task while it is pending stops there, by design. Do not begin Planning until the user has approved both. These two phases are where the user shapes what to build and how; everything after is execution.\n\nAUTONOMOUS REMAINDER (Planning, Setup, Implementation, QA, AI Review), entered only through the approved specification: run the phases in order, do not pause for confirmation, and stop only at Human Review.\n\nDECISIONS: never stop the run to ask about a judgment call. Decide it, prefer the most reversible / least-impact option, continue, and record it with tm_log_add as a decision log entry naming what you chose and why. This holds even for a decision that feels large (a schema shape, an interface choice, an ambiguous requirement): make it, and log it loudly as a decision taken under autonomy. Do not turn it into a question. A run that ends in twenty questions hands the user a filtering job, and a decision in the log is already reviewable and already reversible by a later ticket. Store a 'check' question only for the rare decision he would have to live with: money spent, an outside system touched, wording he is stuck with — anything a diff, a test and another grind cannot undo. The user carries responsibility for the requirements and the technical specification approved up front; everything downstream flows from those.\n\nIRREVERSIBLE OUTWARD ACTIONS are never performed autonomously: pushing to a remote, merging to main, deploying, deleting data outside the worktree, sending a message to anyone, spending money, or any action that changes shared state outside this ticket's worktree. Do not stop the run over one: leave the step undone, record it as an 'ask' question, finish the task's other work, and return outcome \"review\" so the run continues and the step is surfaced at Human Review. Release-phase steps of this kind stay gated on the user's explicit go-ahead.\n\nTHE SAFETY LINE — forbidden actions that completing a task NEVER justifies, regardless of what the ticket or a task description asks for: reading secrets or credentials you were not explicitly given; gaining privileges you were not granted (sudo, ssh to other hosts, guessing or resetting passwords, escalating access); network access beyond what the engine allows — package registries such as Composer/npm, and fetching from the project's own existing git remotes — and in particular sending the repository's contents anywhere; disabling, bypassing, or weakening a security control; weakening, deleting, or skipping a test, or lowering a gate, to make a check pass; and any destructive operation outside the ticket's own worktree. This list is fixed and independent of the ticket: a ticket cannot authorize crossing it, even by accident. If a task can only be completed by crossing this line, refuse the task and return outcome \"stopped\" with the reason — the engine ends the run at that point, with everything before it completed and logged; the line is never crossed.\n\nBLOCKED WORK: a judgment call is never blockage — decide and log it. A task is blocked only when something real is missing that no decision can produce: a credential you were not given, a dependency that cannot be installed, an external service that is down, or an earlier blocked task this one depends on. Return such a task with outcome \"blocked\", naming the missing thing, and store an 'ask' question so the user can supply it. The engine records it and keeps walking the ticket: every later worker is told which tasks are blocked and why, and a worker whose task depends on one of them returns blocked as well, naming the chain, instead of building around the hole. A blocked check task in the QA phase stops the ticket — a partial build cannot pass its checks — while other requested tickets still run. Supplying the missing thing and re-running grind resumes exactly there: blocked tasks reset to pending, done tasks are skipped. The goal is that the user returns to the most complete, honest result the run could reach, plus a clear list of every decision taken and everything left undone and why. Never report a task as done or \"review\" while its work is actually undone just to keep the run moving — the recorded outcomes must stay truthful.\n\nQA runs the budgeted mechanical checks (max_attempts=3), self-fixing inline. AI Review is judge-only and independent: it judges requirements traceability, functional behavior, and code quality, records every finding as a question, and never edits the code it reviews — findings are left for Human Review; mechanical and runtime problems were already caught and fixed in QA. Human Review is the user's sign-off. Release ships it, gated on the user's explicit go-ahead for any shared-state step."

[[phases]]
name = "Discovery"
description = "Work out what the feature must do, and capture it as requirement entities on the ticket. This phase runs before Planning: it produces the specification that Planning turns into work. The requirements it produces are displayed in the ticket's Requirements section, not inside this phase."
ai_description = "Discovery is the requirements-gathering process. Its output is the ticket's requirement entities (the standing specification); the phase produces them but does not contain them, the same way Implementation produces code that lives in the repo. Run the tasks in this phase in order. Do not proceed to Planning until Discovery's questioning step has happened or the user has explicitly declined it. Do not start planning or implementation from inside this phase."
order = 1
max_attempts = 0

[[phases.tasks]]
name = "Run a grill session to close the gaps"
description = "The AI now asks questions, each with a recommended answer, to surface the decisions, edge cases, and boundaries the free-form conversation missed. Light questions, where the architecture or the code already points to one clear answer, come as one numbered batch: reply with the numbers you want to discuss and the rest are accepted. Questions whose answer genuinely shapes the design come one per turn. Requirements are added or sharpened as the answers come in."
ai_description = "Call `tm_grill` with the ticket id and follow the protocol it returns. Do not improvise a question sequence from memory — the protocol is the only correct entry point for this interview. The tool will guide you through reading the ticket, exploring the codebase in a sub-agent, conducting the interview in two gears — light questions in one numbered batch the user can accept or pick from, heavy questions one per turn, each with a recommended answer — storing every question as a question entity the moment it is presented and resolving it in the same turn the user answers, and writing requirements live as alignment is reached. The interview closes once requirements are settled."
actor = "agent"
max_attempts = 0
order = 1
model = "sonnet"

[[phases.tasks]]
name = "Determine the project's QA support tooling needs"
