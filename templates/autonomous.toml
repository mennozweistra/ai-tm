max_attempts = 0

[[phases.tasks]]
name = "Create the ticket workspace and worktrees"
description = "Update main, create the ticket directory at <project directory>/tickets/ticket-<id>-<slug>/, and add a git worktree there for each repo the ticket touches, each on a new branch for the ticket."
ai_description = "Update the main checkout to the latest main (pull) for each repo the ticket touches. Create the ticket directory at <project path>/tickets/ticket-<id>-<slug>/ (project path is the project's root). For each repo the ticket touches, run git worktree add into that directory on a new branch named ticket-<id>-<slug>, and confirm the worktree is on that branch.\n\nBefore finishing, double-check the already-identified list of touched repos against each touched repo's own composer.json (\"repositories\" entries of \"type\": \"path\") or package.json (workspace/\"file:\" dependencies): if any of those local dependency repos is missing from that list, create a worktree for it too, on the same ticket branch, rather than leaving it to be discovered later and worked around. This is a backstop in case the touched-repo determination missed a build dependency.\n\nPlace any uncommitted workspace files the ticket needs (notes, a brief, a docker compose override) at the top of the ticket directory, above the worktrees, so they stay outside every repo. Do not clean up afterward — the ticket directory persists."
actor = "agent"
max_attempts = 0
