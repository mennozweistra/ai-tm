[[phases]]
name = "AI Review"
description = "AI-driven review, judge-only: requirements traceability, functional behavior, and code quality. Each task runs once and records its findings as questions; the reviewer never edits the code it reviews. Findings are left for Human Review — mechanical and runtime problems are already caught and fixed earlier, in the budgeted QA phase. Recording a finding never halts the run."
ai_description = "Run these tasks in order — requirements traceability, then the functional review, then the code review. This phase is judge-only: each task reads and reports and never edits the code it reviews, so its judgment stays independent. It does not fix anything — the budgeted QA phase before it is where mechanical and runtime problems are caught and fixed inline.\n\nRoute every finding as a question, and keep the run moving — recording a question never halts it. A finding you can state and stand behind but that needs the user's eye (a suppression added, an ambiguity resolved by a guess, partial coverage, a real but minor bug): record it as a 'check' question via tm_question_add. A finding that needs the user's own call, or is too big for this ticket (a new ticket proposed, never created silently): record it as an 'ask' question. Set requirement verification with tm_requirement_set as you go: 'met' or 'unmet' for every requirement, not only the failing ones — an 'unmet' requirement is itself a finding, recorded the same way. Pass the ticket id, the review task's id as `task`, and the model you are running as `model` on every question, and write each self-contained for a cold reader with your recommendation. The run proceeds to Human Review, where these findings are the user's to act on."
order = 7
max_attempts = 0

[[phases.tasks]]
name = "Requirements traceability"
description = "Confirm every requirement entity on the ticket is met by the built code, and set each requirement's verification. Judge-only — an unmet requirement is recorded as a finding for Human Review, not fixed here."
ai_description = "For each requirement entity on the ticket, find the code and tests that satisfy it and confirm it is actually met. Put the requirement-to-code mapping in this task's result. For each requirement, call mcp__tm__tm_requirement_set with the requirement's id and verification set to \"met\" if the code fully satisfies it, \"unmet\" if it does not, or leave it \"unverified\" only if you genuinely cannot determine the outcome (rare — explain why in the result). Do this for every requirement before finishing, not just the ones that fail. This is judge-only: do not fix anything here. An \"unmet\" requirement is a finding — record it as an 'ask' question via tm_question_add and carry on; it does not halt the run, it is left for Human Review."
