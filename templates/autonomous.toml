[[phases.tasks]]
name = "AI functional review"
description = "Independently run the feature and verify it works against the requirements, using whatever interface it exposes. Judge-only — findings are recorded as questions for Human Review, not fixed here (the budgeted QA phase is where runtime bugs are fixed)."
ai_description = "Exercise the feature end to end against the requirements, using whatever interface it exposes — for a web app, drive the user interface and call its endpoints; for a CLI or library, run its commands or call its API directly. Confirm each requested behaviour actually works when run — not merely that the tests pass. This is a judge-only pass: record what you exercised and the per-requirement outcome in this task's result, and record any failure as a finding (a 'check' question if you can state it plainly, an 'ask' question if it needs the user's call) — do not fix it here; the budgeted QA phase before this is where runtime bugs are caught and fixed. Recording a finding never halts the run; it proceeds to Human Review. (Performed by a clean Claude Code agent now; designed to be delegated later to another AI with the right controls for the interface.)"
