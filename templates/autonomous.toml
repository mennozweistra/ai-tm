[[phases.tasks]]
name = "Documentation check"
description = "Compare the ticket's diff against the docs and write any missing documentation update inline, so every documented surface the ticket changed is covered."
ai_description = "Read the ticket's full diff (all commits since the branch diverged from main). For each change that alters documented behavior — a route or query parameter added/renamed/removed, a public API shape, a CSS class or design-system catalogue entry, an architectural decision, a feature added or removed, a config option — confirm the matching documentation was updated in the same set of commits: the project's architecture document, README, API docs, and any other docs referenced by the project's AGENTS.md. Put the change-to-documentation mapping in this task's result, one line per changed surface, citing the doc file and section that covers it. A missing or incomplete documentation update is a failing check — this is a budgeted check-phase task, so write the missing documentation inline in this same run and commit it."
actor = "agent"
