model = "sonnet"

[[phases.tasks]]
name = "Set up the project's QA support tooling"
description = "Install and configure the support tooling Discovery recorded as requirements — test runner, linter/formatter, static analysis or type checker — appropriate to the project's language, so Implementation and the QA checks have real tools to run. If Discovery recorded no tooling requirements, confirm what is already in place and record that."
ai_description = "Read the ticket's requirements for the tooling gaps Discovery recorded (phrased as 'set up <tool> for <language>'). For each one, install and configure that tool inside the ticket's worktree, project-scoped — a dev dependency in the project's own package manifest plus its config file, never a system package. Nothing in this template or the engine binds a language to one specific tool: the requirement names the tool that was agreed for this project, and this task installs exactly that. Run each tool once after setup to prove it works, and commit the configuration on the ticket branch. If Discovery recorded no tooling requirements, check what the project already has, record a one-line confirmation in this task's result, and finish — a normal outcome, not a failure."
actor = "agent"
