ai_description = "Part of the collaborative Discovery, done with the user. Identify the project's language and what quality tooling it already has. For each of test runner, linter/formatter, and static analysis/type checker that is missing, discuss with the user whether it should be added — scaled to the project's size and purpose (a throwaway can skip most of it; a maintained or user-facing project should have all three). Turn each agreed gap into a requirement via the grill/requirements flow, phrased as 'set up <tool> for <language>', so the Setup phase installs it before Implementation starts and the QA checks later have something real to run. Nothing in this template binds a language to one specific tool — the requirement names whatever tool was agreed for this project. Do not set anything up here — this task only decides and records requirements."
actor = "agent"
max_attempts = 0
order = 2
model = "sonnet"

[[phases.tasks]]
name = "Approve the requirements"
description = "The user reviews the requirements Discovery produced and marks this task done to approve them. An unattended run that reaches this task while it is pending stops here, by design. This task is for the user — the AI does not complete it."
ai_description = "Do not mark this task done — it is the user's approval of the requirements. A grind run that reaches it while pending stops the ticket here; that is the intended behavior, not a failure. Like the specification approval that follows later, the user can mark it done in advance for a deliberately solo run — the AI never approves on their behalf."
