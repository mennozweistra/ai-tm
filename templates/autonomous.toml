[[phases.tasks]]
name = "AI code review"
description = "A fresh-context AI reviews all of this ticket's code changes against the architecture, conventions, and requirements, and records findings by severity as questions. Judge-only — it does not fix the code it reviews; findings are left for Human Review."
ai_description = "Run a clean-context code review over the complete set of changes made for this ticket (the diff of its commits against the base branch). Read AGENTS.md, CLAUDE.md, and docs/architecture.md first. Review what the mechanical QA tasks cannot: correctness and subtle bugs, adherence to the documented architecture and conventions, readability, maintainability, and test quality. Write the findings grouped by severity into this task's result, and record each confirmed issue as a question via tm_question_add (a 'check' if you can state it and stand behind it, an 'ask' if it needs the user's call or is too big for this ticket — a new ticket proposed, never created silently). This is judge-only: do not fix anything here, and do not halt the run — it proceeds to Human Review, where the findings are the user's to act on. For now this is performed by a clean Claude Code agent (for example the /code-review command or a dedicated review subagent); designed to be delegated later to an external AI reviewer such as CodeRabbit.\n\nReport only what affects correctness, a stated requirement, or a documented architecture rule. A reviewer asked to find gaps will always find some, and chasing them produces defensive code, needless abstraction and tests for cases that cannot happen. Style preferences, speculative improvements and \"could be cleaner\" belong nowhere in the findings.\n"
