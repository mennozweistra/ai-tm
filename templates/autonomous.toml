[[phases]]
name = "Technical Specification"
description = "Before planning the work, the AI drafts a full technical specification for the feature and the user reviews, refines, and approves it. The approval is the switch that starts the autonomous run. This is the design artifact the user reviews at the end alongside the code and the decision log."
ai_description = "Collaborative, done with the user, after Discovery and before Planning. Drawing on the agreed requirements and the project's architecture document (if any), write a complete technical specification for what will be built: the components and how they fit, the key data shapes and interfaces, the main design decisions and why, the notable edge cases, and anything explicitly out of scope. Store it as the ticket's design artifact — in the architecture document or a docs/ spec file if the project keeps one, otherwise in this task's result and on the ticket. Present it to the user and refine until they agree. Their agreement is the phase's human approval task: only the user marks it done, and an unattended run that reaches it while pending stops there, by design — it is the switch into the autonomous remainder. Do not start Planning before it is done: the approved specification is the contract the autonomous run builds against, and the place the user's responsibility for 'how' is pinned down."
order = 2
max_attempts = 0

[[phases.tasks]]
name = "Draft the technical specification for review"
description = "Write a full technical specification for the feature and refine it with the user. The user records agreement in the approval task that follows; Planning does not start before then."
ai_description = "Drawing on the agreed requirements and the project's architecture document (if any), write a complete technical specification: the components and how they fit, the key data shapes and interfaces, the main design decisions and why, the notable edge cases, and what is explicitly out of scope. Store it as the ticket's design artifact — in the architecture document or a docs/ spec file if the project keeps one, otherwise in this task's result and on the ticket. Present it to the user and refine until they agree. Their agreement is recorded in the approval task that follows this one — a human task only the user completes; never mark it done on their behalf.\n\nEnd the specification with an end-to-end check: the scenario that proves the feature works when it is run, in the order someone would actually perform it. The AI functional review later drives exactly that scenario, so leaving it unwritten means the reviewer invents its own idea of what working looks like.\n"
actor = "agent"
max_attempts = 0
order = 1
model = "sonnet"

[[phases.tasks]]
name = "Approve the technical specification"
description = "The user reviews the drafted technical specification and marks this task done to approve it. This approval is the switch that starts the autonomous run: an unattended run that reaches this task while it is pending stops here, by design. This task is for the user — the AI does not complete it."
ai_description = "Do not mark this task done — it is the user's approval of the technical specification and the gate into the autonomous remainder. A grind run that reaches it while pending stops the ticket here; that is the intended behavior, not a failure. If the user wants a run without a reviewed specification (a solo overnight build), the user marks this task done in advance themselves — the AI never approves on their behalf."
