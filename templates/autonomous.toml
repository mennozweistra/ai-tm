model = "sonnet"

[[phases]]
name = "Planning"
description = "Turn the requirements into an implementation plan and a release plan, and decide which repositories this ticket touches. You may rename the Implementation phase, and you may insert extra phases — but only between Planning and QA."
ai_description = "Produce the Implementation-phase task breakdown and the Release-phase plan, and decide which repositories the ticket touches — the detail on how is in this phase's planning task. Run the tasks in this phase in order; a review task may send the plan back to an earlier task for revision. You may rename the Implementation phase to something feature-specific and you may add extra phases, but any added phase goes after Planning and before QA. Do not proceed to Setup until Planning is complete."
order = 4
max_attempts = 0

[[phases.tasks]]
name = "Plan the implementation and release"
description = "Read the requirements and the project's architecture, then create the Implementation tasks and the Release tasks, each naming the requirement it serves where applicable. Decide which repositories the ticket touches — a repository is touched if the ticket edits files in it, or if it is a local path/workspace dependency (for example a composer.json \"type\": \"path\" entry, or an npm workspace/file: dependency) of a repository being edited, since that dependency needs its own worktree too even though its source is never edited directly. The Release tasks are chosen to fit this project (for example tag and publish, push to a remote, or deploy)."
ai_description = "Inputs: the ticket's feature description and the requirement entities on the ticket. Read the project's architecture document under docs/ first — the plan must fit it. If the plan has to diverge from the architecture, or a requirement conflicts with the agreed technical specification, do not stop: choose the most reversible / least-impact plan that still delivers the requirement, continue, and record the divergence as a 'check' question via tm_question_add (the ticket id, this task's id as `task`, the model you are running as `model`, a cold-reader question in plain words with the decision you took in `recommendation`). Reserve an 'ask' question for something that genuinely needs the user's own call, or is too big for this ticket (a new ticket proposed, never created silently) — an 'ask' here is recorded for the user and surfaced at Human Review, it does not halt the run. Smaller planning choices — how to split a task, which of two equivalent sequences to use — are decided and recorded the same way, as a 'check'. Create each Implementation-phase task with a clear name, a description of the work, and a reference to its source requirement in the description (or \"from the feature description\" if there were no formal requirements). Break the work down for a good implementation, not to mirror the requirement count — split large requirements into several tasks, group trivial ones. Support tooling recorded as a requirement in Discovery (test runner, linter, static analysis or type checker) is installed by the Setup phase's own tooling task — do not create Implementation tasks for it.\n\nInclude, among the Implementation tasks, a task that creates or updates any documentation the feature changes — the architecture document, README, API docs, and any other docs referenced by the project's AGENTS.md. This covers both editing an existing doc to reflect a change and writing a new doc or section when the feature introduces something with no existing coverage. Place it as the last Implementation task, since it needs to see the complete diff to know what changed. This is not optional busywork: a later QA check will fail the ticket if a documented surface changed without a matching doc update, so an omitted or incomplete documentation task here comes back to Implementation anyway — plan it in up front instead.\n\nIdentify which repositories the ticket touches, for the Setup phase to create a worktree for each. A repository is touched if (a) the ticket edits files in it, or (b) it is a local path/workspace dependency of a repository being edited — check the composer.json (\"repositories\" entries of \"type\": \"path\") or package.json (workspace/\"file:\" dependencies) of every repository from (a) and include any such dependency repos even though the ticket never edits their source directly. In this toolset, ai-tm and ai-dashboard both depend on ai-lib this way, so touching either always means ai-lib needs its own worktree too.\n\nAlso create the Release-phase tasks the same way, choosing the steps that fit this project (for example tag and publish, push to a remote, or deploy), and leave any shared-state step (merge to main, publish, deploy to production) gated on the user's explicit go-ahead.\n\nWhen creating each Implementation task, also set its `model` field: pick the cheapest model capable of doing the task well, judged from that task's own name and description. Use `haiku` for simple, mechanical steps (renames, formatting, single-line config edits, running an existing scripted check). Use `sonnet` for typical implementation or review work needing ordinary engineering judgment — most tasks land here. Use `opus` only where the task's own difficulty genuinely needs it (deep architectural reasoning, ambiguous requirements needing careful synthesis, a step likely to need retries). Pass the picked value as the `model` argument to `tm_task_add` when creating the task, so it does not fall through to grind's own null-model fallback at execution time.\n\nRecord the plan's shape and any decisions in this task's result; put any architectural decision in the architecture document too.\n\nSlice the tasks so the tests come before the code that satisfies them. Either a task writes its failing tests first and then makes them pass, or one task writes the failing tests and the next makes them green — the second shape is stronger, because the agent that wrote the test is not the one grading its own code. Never plan a task that writes code first and tests afterwards; a test written after the fact agrees with whatever the code does, bugs included.\n"
actor = "agent"
max_attempts = 0
order = 1
model = "opus"

[[phases]]
name = "Implementation"
description = "Do the work. The tasks here were created by the Planning phase; each names the requirement it serves. Build on a feature branch, follow the project's architecture document, keep the code consistent with what's already there. This phase ships empty in the template — Planning fills it."
ai_description = "Implement the tasks in this phase, in order. Each task names its source requirement — build exactly what that requires, no more. Follow the project's architecture document under docs/ and the agreed technical specification. If you hit a situation they don't cover, do not stop: decide which path applies, preferring the most reversible / least-impact option, apply it, keep going, and record it as a 'check' question via tm_question_add. This holds even for a larger call — a schema or migration shape, a public API/CLI/MCP surface, a new workflow or process rule: make the least-impact choice and log it loudly rather than stopping. The only things you never do to finish a task are the actions on the ticket's safety line and irreversible outward actions (push, merge, deploy, delete outside the worktree, send, spend); leave those undone and logged, and still complete every task that does not depend on them. If a genuine user-only call remains, record it as an 'ask' question — surfaced at Human Review, not halting the run. Write tests alongside the code per the project's testing conventions. Work on a feature branch. Record what you did, and any decisions taken along the way, in each task's result. If the plan turns out to be wrong, return to Planning rather than improvising. This phase is empty until Planning populates it."
order = 5
max_attempts = 0
tasks = []

[[phases]]
name = "QA"
description = "The budgeted, self-fixing mechanical check-phase: static analysis, code style, the test suite, the architecture check, the refactor check, the documentation check, and the pre-merge checklist — one concern per task so a failure is individually visible, and a missing tool becomes a logged decision rather than a silent skip. AI Review and Human Review follow."
ai_description = "Run the mechanical checks in this phase, in order. Every task's own max_attempts is 0 — the phase itself carries the retry budget (max_attempts = 3, req 296): a failing check is fixed inline and the phase re-runs its full pass until every check is clean or the phase's attempts are spent. Never lower a gate or weaken a test to make a check pass — that is on the ticket's safety line. When a check fixes an issue inline and the fix involved a real choice between reasonable options, record that decision as a 'check' question via tm_question_add — the question states what was hit, and the recommendation is the decision taken — so the user can later confirm it or reverse it. An issue whose only sound fix would create a new requirement or an architecture change is not fixed here: record it as an 'ask' question via tm_question_add for the user and carry on with the rest of the checks — it is surfaced at Human Review, it does not halt the run. Pass the ticket id, the check task's id as `task`, and the model you are running as `model` on every question, and write each self-contained for a cold reader in plain words. This phase does not judge requirements traceability or run any review — those are done in AI Review, which follows."
order = 6
max_attempts = 3

[[phases.tasks]]
name = "Static analysis"
description = "Run the project's static analysis or type checker and fix any reported error inline until it is clean. If the project has none configured, record it as a decision (whether to add one, given the project's size) rather than skipping silently."
ai_description = "Run the project's static analysis or type checker, whatever it uses for its language (for example mypy or pyright for Python, PHPStan or Psalm for PHP, tsc/eslint type rules for TypeScript, go vet for Go). If one is configured, run it; any reported error is a failing check — this is a budgeted check-phase task, so fix it inline in this same run: find the root cause in the code, repair it, re-run the analyzer until clean, and commit. Never raise the baseline, lower the level, or add a suppression to make it pass — fix the code, not the gate. If none is configured, do not skip silently: record a 'check' question via tm_question_add noting that no static analysis is set up and recommending whether to add it, judged by the project's size and purpose — a throwaway or tiny tool can reasonably accept the gap; anything maintained or user-facing should have it (ideally captured as a requirement back in Discovery). The intent is language-neutral: read what the check is for, then map it to whatever the project's language uses."
actor = "agent"
max_attempts = 0
order = 1
model = "haiku"

[[phases.tasks]]
name = "Code style"
description = "Run the project's formatter/linter and apply its fixes until clean. If none is configured, record it as a decision rather than skipping silently."
ai_description = "Run the project's formatter/linter in check mode, whatever it uses for its language (for example ruff/black/flake8 for Python, php-cs-fixer for PHP, prettier/eslint for JS/TS, gofmt for Go). If one is configured, run it, apply the fixes it wants, and re-run until it reports no changes. If none is configured, do not skip silently: record a 'check' question via tm_question_add noting no formatter/linter is set up and recommending whether to add one, scaled to the project's size and purpose. Never disable rules to make it pass."
actor = "agent"
max_attempts = 0
order = 2
model = "haiku"

[[phases.tasks]]
name = "Test suite"
description = "Run the project's full test suite and fix any failing or unexpectedly skipped test inline until the suite is green. If there is no suite at all, record it as a decision rather than skipping silently."
ai_description = "Run the project's full test suite, whatever runner it uses (for example pytest for Python, PHPUnit/Pest for PHP, jest/vitest for JS/TS, go test for Go). A failing or unexpectedly skipped test is a failing check — this is a budgeted check-phase task, so fix it inline in this same run: find the root cause, repair the code (or the test itself, only when the test asserts something the agreed requirements do not say), re-run until green, and commit. Never delete, skip, or weaken a test just to make it pass — that is on the safety line. If the project has no test suite at all, do not skip silently: record a 'check' question via tm_question_add noting the absence and strongly recommending tests be added — for anything beyond a throwaway, missing tests is a real gap, ideally captured as a requirement in Discovery."
actor = "agent"
max_attempts = 0
order = 3
model = "haiku"

[[phases.tasks]]
name = "Functional check"
description = "Actually run the feature end to end and confirm each requested behaviour works — not just that the unit tests pass. A failure here is fixed inline, like every other check in this phase."
ai_description = "Exercise the built feature the way a user would, using whatever interface it exposes — run the CLI commands, call the API or library functions, drive the web UI — and confirm each requested behaviour actually works end to end, including the paths the unit tests do not reach (real input and output, a real terminal or real request, not in-memory fakes). For an interactive feature, run it under a real pseudo-terminal (for example `script -qec '<command>' /dev/null` or an expect tool): without one the program sees a pipe, and output-flushing or prompt bugs — the exact class this check exists to catch — stay invisible. This catches runtime bugs that still pass the unit tests: output that never reaches a real terminal, a command that errors only when run for real, a default that misbehaves only outside the test harness. Because this is a budgeted check-phase task, a failure is fixed inline in this same run: find the root cause, repair it, re-run the exercise, and commit — do not just report it. If a failure's only sound fix would create a new requirement or an architecture change, record it as an 'ask' question and carry on with the other checks rather than forcing a fix. Never weaken a test or the feature itself to make the exercise pass."
actor = "agent"
max_attempts = 0
order = 4
model = "sonnet"

[[phases.tasks]]
name = "Architecture check"
description = "Run the project's architecture/dependency-boundary check and fix any violation inline, or if it has none, check the code against the boundaries and hard constraints in the spec and requirements."
ai_description = "Run the project's architecture / dependency-boundary check if it has one (for example Deptrac for PHP, import-linter for Python, eslint boundary rules or dependency-cruiser for JS/TS). If configured, run it; any reported violation is a failing check — this is a budgeted check-phase task, so fix the code inline to respect the boundary, re-run until clean, and commit; never loosen the ruleset or add a suppression to make it pass. If the project defines no such tool, treat this as an intent check: confirm the code respects the boundaries and hard constraints the technical specification and requirements set for this ticket (for example 'this layer must not depend on that one', or a stated constraint like 'no auto-solving'). A violation of a stated constraint is fixed inline the same way; if the only sound fix would be an architecture change, record it as an 'ask' question instead and leave the code as is. If there is genuinely nothing to check, record a one-line 'check' note saying so rather than skipping blankly."
actor = "agent"
max_attempts = 0
order = 5
model = "haiku"

[[phases.tasks]]
name = "Refactor check"
description = "Run the project's refactor/modernization tool and apply safe suggestions, or if it has none, do a light manual pass for duplication and dead code. Never change intended behavior."
ai_description = "Run the project's automated refactor/modernization tool if it has one (for example Rector for PHP, pyupgrade for Python, eslint --fix suggestions for JS/TS). If configured, run it in preview mode, apply the safe suggestions, and re-run until clean. If none is configured, do a light manual pass for obvious duplication, dead code, or a standard-library feature reinvented by hand; fix the clear-cut ones and note the rest. Never let this step change intended behavior to satisfy a style preference."
actor = "agent"
