[[phases]]
name = "Setup"
description = "Set up the workspace for this ticket — a git worktree for each repository it touches — and install the QA support tooling Discovery recorded, so Implementation starts with tools ready."
ai_description = "Create the per-ticket workspace before Implementation begins, then install the support tooling Discovery recorded as requirements — the detail on how is in this phase's tasks. Do not delete or clean up the ticket directory once created; it persists for later reference."
