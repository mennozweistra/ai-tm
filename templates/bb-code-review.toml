ai_description = "Run the /code-review-briefing skill. It reads the active ticket from tm, collects the git diff for each repository in the workspace, adds surrounding context for significant changes, and writes CODE_REVIEW.md to the ticket directory. Confirm the file exists and is not empty before marking this task done. If the diff adds or changes a pointerdown/pointerup/click/mousedown/touch listener on an interactive element, call this out explicitly in CODE_REVIEW.md's context notes — whether it branches on event.pointerType where mouse and touch must behave differently — so the external Gemini reviewer's attention is drawn to it (BBDEV-2320 shipped broken on touch because nothing flagged this). Do not send the file anywhere — the user handles the Gemini review step externally."
