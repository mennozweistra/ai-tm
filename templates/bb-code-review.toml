description = "Template for reviewing a colleague's code across the Basebuilder multi-repo stack: check their branches out read-only, run the full QA battery and all AI reviews (fresh-context, Gemini, CodeRabbit, Ponytail) report-only against the changes, consolidate every finding into one review report written for a human reader, and leave posting the feedback to the user. Code review only — no functional testing; use the functional test template when the colleague asks for a feature test."
ai_description = "Work the phases in order. This ticket reviews a COLLEAGUE's work: everything is report-only. Never modify, commit, or push on the colleague's branches — no bb-quality-fix, no fix-in-place; every finding is recorded as feedback instead. Review only the code changed by the colleague's ticket (the diff of each branch against its base) — pre-existing issues on the base branch are out of scope. Intake captures the scope (Jira ticket, repos, branches, PRs) and the requirements as requirement entities. Setup checks the colleague's branches out read-only in worktrees. Automated checks run the QA battery (bb-quality-check, bb-phpunit, CI status, documentation, pre-merge checklist) and record findings. AI Review runs requirements traceability and the code reviews (fresh-context, architecture review against the shared library, Gemini briefing, CodeRabbit CLI, Ponytail over-engineering review, triage of the CodeRabbit PR comments), also report-only. Consolidation merges every finding into one report at the reader's altitude: short, for a human, with the detail kept in the task result. The user reads and edits the report, then chooses how it is delivered: inline PR comments for a small review, one general PR comment for a large one — the AI posts only on his explicit instruction and never transitions Jira.\n\nVERDICT RULE FOR THIS TICKET (overrides the general grind guidance on when to return REVIEW:). Only the Consolidation task may end its summary with `REVIEW:`. Every other agent task ends its summary with `OK:` and writes its findings, doubts and judgement calls into its own task result, where the Consolidation task ranks them once in the review report. A finding in the colleague's code is never a reason to return `REVIEW:` — collecting findings is the job of these tasks, not an exception to flag. Whether a finding blocks the merge is decided by the Consolidation task and then by the user reading the report, never by an individual check. Use `FAILED:` only when the check itself could not be run at all. Storing questions stays free: keep storing `check` questions, and an `ask` question whenever one genuinely arises."

