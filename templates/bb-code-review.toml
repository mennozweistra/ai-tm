ai_description = "Read the full diff of each PR (all commits since the branch diverged from its base), across every repository in scope. For each change that alters documented behavior — a route or query parameter added/renamed/removed, a public API shape, a CSS class or design-system catalogue entry, an architectural decision, a feature added or removed, a config option — confirm the matching documentation was updated in the same set of commits. Check each touched repo's own docs: its architecture document (docs/architecture.md or docs/architecture/architecture.md — check which the repo actually uses), README, API docs, and any other docs referenced by that repo's AGENTS.md. Put the change-to-documentation mapping in this task's result, one line per changed surface, citing the doc file and section. Any undocumented change is a review finding for the consolidation task — do not write the missing documentation yourself."
