[[phases.tasks]]
name = "Consolidate findings into the review report"
description = "Merge and dedupe all findings from the automated checks and AI reviews into one review report that a human reads: REVIEW_REPORT.md, written at the reader's altitude. No draft PR comments."
ai_description = "Read the results of every task in the Automated checks and AI Review phases (tm_task_list plus tm_task_show on this ticket), plus CODERABBIT_REVIEW.md and, if the user placed Gemini's findings in the ticket directory, those too. Merge and dedupe into one entry per real issue, grouped Critical / High / Medium / Low. Load the technical-writer skill for the reader and the register. Write REVIEW_REPORT.md in the ticket directory in this shape and nothing else.\n\nTHE READER. The report is read by two humans: the user, who decides what goes to the colleague, and the colleague, who reads it as review feedback on the PR. Both are senior developers with English as a second language and no context in their head. The report is not written for an AI agent; the detail an agent needs stays in this task's result.\n\nTHE SHAPE. First line: the PR, the author and the reviewer. Then a section \"Requirements not met\": a table with one row per requirement whose verification is unmet or unverified, columns Requirement / State / Finding, and one line saying how many requirements are met. Then a section \"Findings\" with the subsections Critical, High, Medium, Low, in that order. Each finding has: (1) a bold title on its own line, numbered C1, H1, M1, L1 and so on, that states the problem in plain words; (2) two or three short sentences saying what is wrong and why it matters; (3) when needed, a markdown list of lettered items (\"- a. ...\", \"- b. ...\"), so the reader can refer to one item, each item one short sentence; (4) a final line \"Where: `path/File.php`.\" naming the file, with a line number and the method name only when the finding concerns one specific statement. No verdict block, no summary, no list of sources, no list of dismissed items: what was dismissed and why goes into this task's result, not the report.\n\nTHE RULES PER SENTENCE. Simple technical English, active voice, one fact per sentence, no comma chains, no idioms. Name every thing by its full real name (\"participant-service\", never \"the service\"). No cross-reference from one finding to another. No implementation detail: no function names, no design patterns, no line numbers except as stated under (4). No verification facts (\"I confirmed this in the worktree\"). An assumption about the environment or the organisation is written as a question (\"Is this address a shared mailbox?\"), never as a fact. Never assign an action to a named person outside the PR (\"confirm with X\"): state the observed mismatch and ask whether it is correct. State what is, never what is not. Every sentence must pass one test: does the reader need this to understand the problem at this level? When not, it goes to the task result.\n\nWrite the full detail (per finding: file:line, the sources that found it, the verification done, judgement calls, dismissed items with reasons) into this task's result, so the user can pull it on request. Post nothing to Bitbucket or Jira."
actor = "agent"
