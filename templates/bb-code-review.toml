ai_description = "Run a clean-context code review over the complete set of changes in the PRs (the diff of each branch against its base). Read AGENTS.md, CLAUDE.md, and the repo's architecture document first. Review what the mechanical checks cannot: correctness and subtle bugs, adherence to the documented architecture and conventions, readability, maintainability, and test quality. Judge only the code changed by this ticket's diff — pre-existing issues on the base branch are out of scope. If the diff adds or changes a pointerdown/pointerup/click/mousedown/touch listener on an interactive element, check whether it needs to (and does) branch on event.pointerType — pointer events fire identically for mouse, touch, and pen unless the code guards for it (BBDEV-2320); treat a missing gate as a finding. Write the findings grouped by severity into this task's result. Fix nothing."
