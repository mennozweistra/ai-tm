description = "Template for reviewing a colleague's code across the Basebuilder multi-repo stack: check their branches out read-only, run the full QA battery and all AI reviews (fresh-context, Gemini, CodeRabbit, Ponytail) report-only against the changes, consolidate every finding into one review report with draft PR comments, and leave posting the feedback to the user. Code review only — no functional testing; use the functional test template when the colleague asks for a feature test."
ai_description = "Work the phases in order. This ticket reviews a COLLEAGUE's work: everything is report-only. Never modify, commit, or push on the colleague's branches — no bb-quality-fix, no fix-in-place; every finding is recorded as feedback instead. Review only the code changed by the colleague's ticket (the diff of each branch against its base) — pre-existing issues on the base branch are out of scope. Intake captures the scope (Jira ticket, repos, branches, PRs) and the requirements as requirement entities. Setup checks the colleague's branches out read-only in worktrees. Automated checks run the QA battery (bb-quality-check, bb-phpunit, CI status, documentation, pre-merge checklist) and record findings. AI Review runs requirements traceability and the code reviews (fresh-context, Gemini briefing, CodeRabbit CLI, Ponytail over-engineering review, triage of the CodeRabbit PR comments), also report-only. Consolidation merges every finding into one report with draft PR comments. The user reads, edits, and posts the feedback himself — the AI never posts to the PR and never transitions Jira.\n\nVERDICT RULE FOR THIS TICKET (overrides the general grind guidance on when to return REVIEW:). Only the Consolidation task may end its summary with `REVIEW:`. Every other agent task ends its summary with `OK:` and writes its findings, doubts and judgement calls into its own task result, where the Consolidation task ranks them once in the review report. A finding in the colleague's code is never a reason to return `REVIEW:` — collecting findings is the job of these tasks, not an exception to flag. Whether a finding blocks the merge is decided by the Consolidation task and then by the user reading the report, never by an individual check. Use `FAILED:` only when the check itself could not be run at all. Storing questions stays free: keep storing `check` questions, and an `ask` question whenever one genuinely arises."

[[phases]]
name = "Intake"
description = "Capture what is being reviewed: the colleague's Jira ticket, the repositories and branches, the pull requests — and the requirements the code must meet, as requirement entities on this ticket."
ai_description = "Read-only intake. Ask the user for the colleague's Jira ticket key and/or PR links if they were not provided. Never transition or comment on Jira; never post on the PRs."
order = 1
max_attempts = 0

[[phases.tasks]]
name = "Capture the review subject and requirements"
description = "Read the colleague's Jira ticket and pull requests, record the scope (repositories, branches, PR links), and capture each requirement the change must meet as a requirement entity on this review ticket."
ai_description = "Inputs from the user: the colleague's Jira ticket key and/or the Bitbucket PR links. Read the Jira ticket (description, acceptance criteria, comments) via the Jira MCP tools — read-only, never transition or comment. Open each pull request and record: repository, source branch, target branch, PR link, and a one-line summary of what the PR changes. Also skim the PR's existing comments and activity so the review does not repeat feedback already given. Capture each requirement the change is supposed to meet as a requirement entity via tm_requirement_add — discrete, individually verifiable statements, phrased from the Jira ticket's own text, not invented; if the Jira ticket is too thin to yield requirements, record that and ask the user rather than inventing them. Record the full scope (repos, branches, PR links, requirement count) in this task's result. If the Jira ticket or PRs cannot be found, stop and ask the user rather than guessing."
actor = "agent"
max_attempts = 0
order = 1
model = "sonnet"

[[phases]]
name = "Setup"
description = "Check the colleague's branches out read-only: update the main clones, then create a worktree per repository on the colleague's existing branch. No new branches, no commits, no pushes."
ai_description = "This workspace exists to read the code and run the checks. Never commit or push from these worktrees — they hold a colleague's branch, not ours."
order = 2
max_attempts = 0

[[phases.tasks]]
name = "Update affected repositories"
description = "For every repository in the review scope, make its main clone current: confirm it is on its default branch (main/master) with no uncommitted changes, then fetch and fast-forward it to origin. Never leave a main clone on a feature branch."
ai_description = "For each repository recorded at intake, operate on the MAIN clone (not a worktree): run git fetch; confirm the clone is on its default branch (main or master) and has no uncommitted changes; then fast-forward it to origin/<default>. Do NOT push. Do NOT switch branches as normal operation. If a clone is on a feature branch, has uncommitted changes, or cannot fast-forward because the local branch has diverged, do not force anything — stop and flag it to the user. Record, per repository, the branch and the before/after commit in this task's result."
actor = "agent"
max_attempts = 0
order = 1
model = "haiku"

[[phases.tasks]]
name = "Create review worktrees"
description = "For every repository in the review scope, create a worktree in the ticket directory checked out on the colleague's existing feature branch, and prepare it for the quality tools (composer install, copy .env). Never push, never commit."
ai_description = "Create the ticket directory following the project's convention (tickets/feature/BBDEV-XXXX-<slug>/, using the colleague's Jira key). For each repository in scope:\n1. git -C <main-clone> fetch\n2. git -C <main-clone> worktree add <ticket-dir>/<repo> <colleague-branch> — this creates a local branch tracking origin/<colleague-branch>; the main clone stays on its default branch.\n3. git -C <worktree> branch -vv — confirm it tracks the colleague's origin branch.\n4. composer install in the worktree (the quality tools are vendor binaries).\n5. If the main clone has a .env, copy it into the worktree (cp <main-clone>/.env <worktree>/.env).\nNEVER push and NEVER commit from these worktrees — this is a read-only checkout of a colleague's branch. Record each worktree path and its tracking line in this task's result."
actor = "agent"
max_attempts = 0
order = 2
model = "haiku"

[[phases]]
name = "Automated checks"
description = "Run the QA battery against the colleague's code, report-only: code quality (Rector, ECS, PHPStan via bb-quality-check), the test suite, CI status, the documentation check, and the pre-merge checklist. Findings are recorded for the consolidation step — nothing is fixed."
ai_description = "Run every check and record its findings in the task's result, including a clean pass. Never fix anything: no bb-quality-fix, no code edits, no commits. A failing check here is a review finding, not a defect to repair — this phase records and moves on; it never loops back. A task in this phase fails only when its check could not be run at all."
order = 3
max_attempts = 0

[[phases.tasks]]
name = "Code quality check"
description = "Run bb-quality-check (Rector, ECS, PHPStan) in every worktree and record all findings. Report-only — never run bb-quality-fix on a colleague's branch."
ai_description = "For each repository worktree: cd into the repo directory first — Rector fails silently on the wrong rule set when called from a different working directory — then run `vendor/bin/bb-quality-check`. Record every reported issue (tool, file, line, message) in this task's result, grouped per repository; a clean pass is also recorded. Do NOT run bb-quality-fix and do not edit any file: this is a colleague's code and every issue is a review finding for the consolidation task. This task does not fail on findings — its job is to collect them; it fails only if the check itself cannot run."
actor = "agent"
max_attempts = 0
order = 1
model = "haiku"

[[phases.tasks]]
name = "Test suite"
description = "Run the full test suite (bb-phpunit) in every worktree and record failures. Report-only."
ai_description = "Ensure the local Docker stack is running (`dk start`) if the tests need services. For each repository worktree, two runs: the unit tests with the host PHP from inside the repo directory (`vendor/bin/bb-phpunit` or `vendor/bin/phpunit tests/Unit`), and the integration tests (tests/Integration, where present) inside the service's fpm container, because the worktree's .env names the container hostnames (mariadb, elasticsearch, mongo) that do not resolve on the host: `docker exec basebuilder-stack-<service>-fpm-1 php vendor/bin/phpunit tests/Integration`, container name from `docker ps`. Record the outcome per repository and per run — failing, skipped, or incomplete tests with their names and messages — in this task's result; a clean pass is also recorded. Do not fix, delete, or weaken any test: a failure here is a review finding for the consolidation task. A connection error is not a finding against the colleague's code but a broken environment: fix the environment and run again. This task fails only if the suite itself cannot run."
actor = "agent"
max_attempts = 0
order = 2
model = "haiku"

