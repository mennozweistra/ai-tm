[[phases.tasks]]
name = "Architecture review against the shared library"
description = "Check where the colleague's new code lives against the architecture rules of the stack: what belongs in the shared library, which shared module owns the tables the change writes, and which shared components already cover the same concern. Report-only."
ai_description = "The diff-only reviews miss this by construction: a placement finding needs knowledge of code outside the diff. Read basebuilder-stack AGENTS.md, docs/architecture/overview.md and docs/architecture/target-state.md in full first. Then, for every class the diff adds or changes in a service repository (not in bb-service-shared), answer these questions by looking in bb-service-shared on the branch line the service pins (1.x/main for Lumen services, 2.x for Laravel services):\n1. Ownership: does the class read or write a table that a shared module owns (a model under src/Domain/Models or src/Domain/Modules/*/Models)? If so, the rule is that only that module's repository writes to it, and the change belongs in that module. Name the owning module and its repository.\n2. Reuse: does a shared module or component already cover the same concern (email sending, object storage, export, receipt scanning, encryption, rate limiting, ...)? If so, name it and say what the diff duplicates or bypasses.\n3. Placement: is the new code business logic (rules, eligibility, claims, calculations) or glue (HTTP, commands, schedule entries, mail templates)? Business logic in a service repository is a finding unless the ticket explicitly asks for a one-off script; then record it as an open decision, not a defect.\n4. Rules that the pre-merge checklist skips for service code because its rules are path-scoped: custom exceptions extend BasebuilderException; value object names end in VO; constructors do no I/O; no personal data in exception messages or logs.\nRecord every finding with the file, the rule it breaks (quote the doc line) and the shared class it should use or extend. Also record what was checked and found in order, so the consolidation task can say so. Fix nothing, post nothing."
actor = "agent"
max_attempts = 0
order = 4
model = "opus"

