description = "Confirm the Release preparation phase's work still holds, now that the colleague review is done and time has passed. Check that the feature branches are still up to date with master, that the lockfiles still resolve, that the environment-variable list is still complete, and that the pull request has no unresolved comment. Repair what went stale and record what was re-done."
ai_description = "The Release preparation phase ran before the colleague review finished, so its work can be stale by now. Run this task immediately before each deploy, including before the optional review-environment deploy.\n\nCheck four things, in this order:\n1. Each feature branch is still up to date with its base branch: `git rev-list --count <branch>..origin/master` (or origin/main) is 0 in every worktree.\n2. The lockfiles still resolve: run the lockfile validation the repository supports (composer validate and a bb-composer install --dry-run from the service worktree, pnpm install --frozen-lockfile for a node repository).\n3. The environment-variable list in the \"Environment variables to share\" task result still matches the diff: re-read the diff for env-var reads added or renamed since that task ran.\n4. Every pull request for the ticket has no unresolved comment.\n\nWhere something went stale, repair it by re-running the steps of the Release preparation task that owns it, under the same rules that task states — in particular, merging base updates into a feature branch pushes and therefore needs the user's explicit go-ahead. Record in this task's result what you checked, what was still good, and what you re-did. If a repair is more than a lockfile refresh or a clean merge, stop and report rather than deploying on a guess."
