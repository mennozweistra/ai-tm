[[phases]]
name = "Improvement rounds"
description = "These checks run after Menno's review and before the merge. Each check has one trigger, stated in the first sentence of its own description, and runs only when that trigger fired. A finding is handled like a change request: it becomes an Implementation task, the Gate re-runs, and Menno re-reads the diff briefly when the fix is more than mechanical."
ai_description = "For each task in this phase, first evaluate the task's trigger against the ticket's diff and Menno's review notes. When the trigger did not fire, set the task to status \"skipped\" with tm_task_set, give a one-line reason in the result, and stop; do not run the check. When the trigger fired, run the check exactly as the task's own text describes it.\n\nA finding from a check that fired is handled like a change request from Menno: create an Implementation task for it with tm_task_add, let the Gate re-run, and ask Menno for a short re-read of the diff when the fix is more than mechanical. A purely mechanical fix (a lockfile refresh, a dead-code deletion, a documentation correction) needs no re-read.\n\nRoute anything the check cannot resolve itself as a question via tm_question_add (kind 'ask' for a user call, 'check' for a decision already taken), passing the ticket id, the task's id as `task`, and the model you are running as `model`, each self-contained for a cold reader with your recommendation."
order = 8
max_attempts = 0

[[phases.tasks]]
name = "Architecture check"
description = "Trigger: Menno's review raised a structural concern, or the ticket adds a module or service boundary. Check the ticket's changes against the architecture document. Basebuilder has no dependency-boundary tool; the check is done by reading. The task fails on any violation."
ai_description = "Evaluate the trigger first: Menno's review raised a structural concern, or the ticket adds a module or service boundary. If neither holds, set this task to status \"skipped\" with tm_task_set, give the one-line reason in the result, and stop. Otherwise run the check below.\n\nThere is no Deptrac or other architecture tool in Basebuilder; do not look for one and do not skip this task for its absence. The architecture is defined in the basebuilder-stack repository: docs/architecture/target-state.md and the other documents under docs/architecture/. Read them, then read the ticket's full diff (git diff origin/<base>...HEAD in every worktree of the ticket). For every changed or added file, check that it follows the rules those documents state: where a class of this kind lives, what it may depend on, how exceptions and logging are done, how services and value objects are shaped. Record in the result one line per rule that applies to the diff, with pass or fail and the file. Any violation ends the task REVIEW: with the violation named; do not fix it here and do not reinterpret a rule to make the code pass."
actor = "agent"
max_attempts = 0
order = 1
model = "haiku"

[[phases.tasks]]
name = "Documentation check"
description = "Trigger: the diff changes documented behaviour, a public interface, or a cross-repository contract. Confirm the documentation this ticket should have updated was actually updated, by comparing the diff against the docs."
ai_description = "Evaluate the trigger first: the diff changes documented behaviour, a public interface, or a cross-repository contract. If none of those holds, set this task to status \"skipped\" with tm_task_set, give the one-line reason in the result, and stop. Otherwise run the check below.\n\nRead the ticket's full diff (all commits since the branch diverged from its base branch), across every repository the ticket touched — a Basebuilder ticket may touch more than one repo; check the diff in each. For each change that alters documented behavior — a route or query parameter added/renamed/removed, a public API shape, a CSS class or design-system catalogue entry, an architectural decision, a feature added or removed, a config option, a queue or worker — confirm the matching documentation was updated in the same set of commits, and confirm existing documentation still accurately describes the current code, not just the code as it stood when that documentation was first written — a later commit in the same ticket (a fix from a review, a rename, a guard clause added afterward) can leave earlier documentation stale even when nothing was originally missing.\n\nCheck each touched repo's own docs: its architecture document (the exact path varies by repo — docs/architecture.md or docs/architecture/architecture.md; check which the repo actually uses), README, API docs, and any other docs referenced by that repo's own AGENTS.md. Always check the stack-wide documentation in basebuilder-stack too: docs/modules/<module>.md for every module the ticket touched, and docs/architecture/ where an architectural decision changed. Those stack documents live on basebuilder-stack master, not on the ticket's branch; an uncommitted edit there counts as updated.\n\nA documentation gap is fixed here, not asked about: a wrong or incomplete document is corrected at once, in the repository where the document lives, and the fix is recorded in this task's result. A wording choice is never a question. Only a gap whose fix needs a decision the user has not taken (a new architectural rule, a changed requirement) becomes an 'ask' question via tm_question_add, and then the task ends REVIEW:.\n\nPut the change-to-documentation mapping in this task's result, one line per changed surface, citing the doc file and section that covers it, and note for each whether it needed no change or got a fix."
actor = "agent"
max_attempts = 0
order = 2
model = "sonnet"

[[phases.tasks]]
name = "Ponytail review"
description = "Trigger: Menno's review called the diff over-built, or the diff introduces a new abstraction. Run the Ponytail over-engineering review against this ticket's changes: what to delete, simplify, or replace with a standard-library or native equivalent. Scoped to the diff, not the full repositories. Clear-cut simplifications are applied in place; anything bigger becomes a question for the user."
ai_description = "Evaluate the trigger first: Menno's review called the diff over-built, or the diff introduces a new abstraction. If neither holds, set this task to status \"skipped\" with tm_task_set, give the one-line reason in the result, and stop. Otherwise run the check below.\n\nRun the ponytail:ponytail-review skill against this ticket's changes — the diff of each feature branch against its base, for every repository in the workspace. Do not review whole repositories; only the changed code is in scope. Ponytail hunts complexity, not correctness: reinvented standard library, unneeded dependencies, speculative abstractions, dead flexibility — one line per finding with location, what to cut, and what replaces it.\n\nPonytail changes code, so anything it applies here invalidates the Gate's earlier verdict. Re-run the Gate after applying a simplification, so the pre-merge checklist judges the code that will actually be merged rather than the code as it stood before the cut.\n\nApply the clear-cut simplifications (dead code, a reinvented standard-library call, an unused abstraction), and record what was applied and what was intentionally left in this task's result. Re-run the quality tools and the test suites from the host afterwards, never via docker exec.\n\nA simplification that would change the architecture, an interface other code depends on, or a requirement is not applied here — store it as an 'ask' question via tm_question_add (the ticket id, this task's id as `task`, the model you are running as `model`, self-contained for a cold reader with your recommendation) and leave the call to the user. Zero findings is a valid outcome."
actor = "agent"
max_attempts = 0
order = 3
model = "sonnet"

[[phases.tasks]]
name = "Package check"
description = "Trigger: composer.lock or package-lock.json changed in the diff. Two parts. First, re-pin the roave/security-advisories guard so composer update refuses versions whose problems are known up to today. Then run the package check on every repository the ticket touches."
ai_description = "Evaluate the trigger first: composer.lock or package-lock.json changed in the diff. If no lockfile changed, set this task to status \"skipped\" with tm_task_set, give the one-line reason in the result, and stop. Otherwise run both parts below, in order.\n\nPART 1 — REFRESH ROAVE/SECURITY-ADVISORIES.\nFor every PHP worktree of this ticket (composer.json present), run `bb-composer update roave/security-advisories` from the worktree directory and commit the lockfile change on the feature branch. Composer runs only through bb-composer for a stack service (docs/composer.md); a repository without a php-fpm tag in bitbucket-pipelines.yml falls back to the host composer by itself. The package holds no code, only a conflict list, so nothing else changes. If the update fails, a version already in the lockfile is on the new advisory list — name that package and stop; the failure is itself a finding. If a repository does not carry roave/security-advisories in require-dev, record that as a finding instead of adding it silently. Skip repositories without composer.json.\n\nPART 2 — PACKAGE CHECK.\nRun the /package-check skill in each worktree of this ticket. Where the report says a plain lockfile refresh reaches a fix, apply it with bb-composer from the worktree directory (never the host composer, docs/composer.md), verify with the quality checks and the test suite, and commit on the feature branch. Where a fix is blocked by a constraint, has no released fix, or needs a decision, store a question instead of acting.\n\nAny lockfile this task commits changes the dependency state the Gate already judged, so re-run the Gate afterwards; the pre-merge checklist must judge the final dependency state."
actor = "agent"
max_attempts = 0
order = 4

[[phases.tasks]]
name = "AI code review - CodeRabbit PR"
description = "Trigger: the pull request is open. Wait for Flappie (CodeRabbit) to post its automated review on the pull request in Bitbucket. Read every comment and fix what needs fixing. Critical and High findings must be resolved before the merge. Low findings should be reviewed and fixed unless there is a clear reason not to."
ai_description = "Evaluate the trigger first: the pull request is open. If no pull request exists for this ticket, set this task to status \"skipped\" with tm_task_set, give the one-line reason in the result, and stop. Otherwise run the check below.\n\nOpen the pull request on Bitbucket and read Flappie's (CodeRabbit's) review comments. Fix all Critical and High findings — apply the fix, commit, and push. Review every Low finding and fix it unless there is a specific architectural or intentional reason not to; document any finding you deliberately leave. Reply to every comment recording its disposition, so the pre-merge checklist's \"No open Flappie issues\" rule is satisfied before the merge. Additionally, independently of CodeRabbit's comments: if the diff adds or changes a pointerdown/pointerup/click/mousedown/touch listener on an interactive element, check whether it needs to (and does) branch on event.pointerType (or an equivalent input-type check) — pointer events fire identically for mouse, touch, and pen by design, so code that assumes one input method without gating on pointerType silently misbehaves on the others (BBDEV-2320). Treat a missing gate as a finding of your own even if CodeRabbit did not surface it. Record a summary of all findings and their resolutions in this task's result. Only mark this done when no Critical or High finding remains open."
actor = "agent"
max_attempts = 0
order = 5
model = "sonnet"

[[phases]]
name = "Release preparation"
description = "Get the reviewed feature ready to ship: confirm everything is committed and pushed, list the environment variables the feature needs, and bring every feature branch up to date with the base branch. This work starts right after Menno's review, alongside the colleague review, so that no release step waits for a colleague. It is re-checked immediately before each deploy, because the colleague review comes late and the base branch moves while it runs."
ai_description = "Perform these tasks in order, starting as soon as Menno's review is done; the Colleague review phase runs at the same time and does not block this preparation. Steps that change shared state — merging base updates into feature branches, which pushes — are never unprompted; do them only on the user's explicit go-ahead. Documentation updates happen earlier, as the last Implementation task, and are checked by the Documentation check improvement round when its trigger fires — nothing to do here for docs. Expect this preparation to go stale: the Deploy phase's first task re-checks it and repairs what drifted, so record here what you did precisely enough for that re-check to compare against."
