ai_description = "For every PHP worktree of this ticket (composer.json present), run `composer update roave/security-advisories` and commit the lockfile change on the feature branch. The package holds no code, only a conflict list, so nothing else changes. If the update fails, a version already in the lockfile is on the new advisory list — name that package and stop; the failure is itself a finding. If a repository does not carry roave/security-advisories in require-dev, record that as a finding instead of adding it silently. Skip repositories without composer.json."
