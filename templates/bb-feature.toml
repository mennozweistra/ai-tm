[[phases.tasks]]
name = "Open the pull requests and confirm CI is green"
description = "Confirm all code is committed and pushed on every feature branch, then open a pull request for each repository involved in the ticket. Then wait for the CI pipeline to complete on every open pull request. All checks must pass before the human review starts."
ai_description = "Part one — open the pull requests. For each repository in the workspace: confirm there are no uncommitted changes and no unpushed commits on the feature branch. Push if needed. Then open a pull request targeting the base branch (main or master) with a clear title and a description summarising the changes. Record every PR URL in this task's result. Do not open PRs until the Gate phase has completed one clean pass.\n\nPart two — confirm CI is green. Check the CI pipeline status on every PR you just opened. Wait for all checks to complete. If any check fails: identify the failing step, fix the root cause (returning to Implementation if needed), re-run the Gate phase, push, and wait for CI again. Only mark this task done when every PR's pipeline is fully green."
