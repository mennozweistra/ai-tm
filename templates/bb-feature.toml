[[phases.tasks]]
name = "Test suite"
description = "Run the full test suite: the unit tests from the host, the integration tests inside the service's fpm container against the local stack. The task fails on any failing or skipped test."
ai_description = "Two runs per PHP worktree, both required. (1) Unit tests, from the worktree directory with the host PHP: `vendor/bin/bb-phpunit` or `vendor/bin/phpunit tests/Unit`. (2) Integration tests (tests/Integration, where the repository has them): they need the local Docker stack and the worktree's .env names the container hostnames (mariadb, elasticsearch, mongo), so they cannot run from the host. Run them inside the service's fpm container, which mounts the worktree: `docker exec basebuilder-stack-<service>-fpm-1 php vendor/bin/phpunit tests/Integration`; find the container name with `docker ps`. Check first that the stack is up; if it is not, start it from the basebuilder-stack directory with the ticket's docker-compose override and wait until the services accept connections. Integration tests may wipe local test data; that is what the local stack is for. A failing, skipped, or incomplete test in either run fails the task: record it and stop, do not attempt the fix here. Do not delete, skip, or weaken a test to make it pass. A connection error is a failed run, not an acceptable skip: fix the environment and run again."
actor = "agent"
max_attempts = 0
order = 3
model = "haiku"

[[phases.tasks]]
name = "Test coverage"
description = "Check that the ticket's tests cover every requirement, or for a bug-fix ticket that a test reproduces the bug. Report-only: a gap fails the task — record it and stop, do not add the missing test here."
ai_description = "For each requirement entity on this ticket, find the test that proves it and confirm the test actually exercises that behaviour, not just that the code exists. For a bug-fix ticket, confirm a test reproduces the original bug and would fail without the fix. Record per requirement (or the bug) the covering test, or \"no test\" where none exists, in this task's result. A missing or inadequate test fails the task — record it and stop, do not write the test here. Do not weaken an existing test to claim coverage."
actor = "agent"
max_attempts = 0
order = 4
model = "sonnet"

[[phases.tasks]]
name = "Architecture check"
description = "Check the ticket's changes against the architecture document. Basebuilder has no dependency-boundary tool; the check is done by reading. The task fails on any violation."
ai_description = "There is no Deptrac or other architecture tool in Basebuilder; do not look for one and do not skip this task for its absence. The architecture is defined in the basebuilder-stack repository: docs/architecture/target-state.md and the other documents under docs/architecture/. Read them, then read the ticket's full diff (git diff origin/<base>...HEAD in every worktree of the ticket). For every changed or added file, check that it follows the rules those documents state: where a class of this kind lives, what it may depend on, how exceptions and logging are done, how services and value objects are shaped. Record in the result one line per rule that applies to the diff, with pass or fail and the file. Any violation ends the task REVIEW: with the violation named; do not fix it here and do not reinterpret a rule to make the code pass."
