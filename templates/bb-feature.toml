o the plan's tasks: fix them via tm_task_add / tm_task_set. When a repair rests on a new assumption of your own, write that new assumption as a new \"assumption\" log entry on THIS task (task set to this task's own id), so the next pass — a fresh sub-agent that remembers nothing of this one — checks it cold.\n\nNever guess an intent assumption. The moment you find one, this task fails: make no repair for it, stop, and write this task's result summary beginning with the token FAILED: (the token grind reads), naming the assumption and the exact question the user must answer to settle it. grind then halts the ticket and the user answers. This rule applies here in Planning exactly as it does in Discovery.\n\nRecord every verdict, not only the failures. For each assumption you reach a verdict on, write an \"assumption\" log entry on THIS task with the fixed skeleton below — both the assumptions that held and the ones that did not — so a later cross-ticket analyzer has a baseline as well as the falsified ones.\n\nWrite no markdown findings file. Your findings live only in the assumption log entries and in this task's result field; a second copy in a file would drift from the log.\n\nEach assumption log entry has title = the assumption in one line, type = \"assumption\", task = this task's own id, and ai_content written as prose following this fixed skeleton, in order: the assumption stated verbatim; its kind (\"fact\" or \"intent\"); what would settle it (a file path, a document, a requirement id, or \"the user\"); the verdict (\"verified\", \"falsified\", or \"needs-user\"); the evidence for that verdict; the repair made, if any; who registered it (this sub-agent and the model it ran as); and the pass number.\n\nThis is a self-contained budgeted task. grind's protocol re-runs it under its max_attempts budget — a fresh sub-agent each pass — and a pass after the first confirms the previous pass's repairs rather than re-verifying the whole list (the CHECK BUDGET block in your prompt carries the rule). It ends when a pass repairs nothing or the budget is spent. Do not implement any loop yourself: state this pass's verdicts and repairs and stop."
