ai_description = "For every repo this ticket has a worktree for: check whether the ticket's branch has any commits (git log <branch> vs its base). A worktree created but never committed to needs no check — skip it. For every repo with real commits, verify master actually contains them: `git rev-list --count master..<branch>` must be 0 (every commit on the branch is already in master), not just that the earlier 'Merge to master and deploy to production' task was marked done — a task can be marked done by mistake without the merge having happened. If a remote exists, also confirm master is not ahead of its pushed state (`git rev-list --count origin/master..master` is 0). If any repo fails either check, do not mark this task done: report FAILED, name the exact repo and branch that is not merged or not pushed, and stop — the ticket must not close until a human completes the actual merge. Only when every touched repo passes does this task close, and with it the ticket."
