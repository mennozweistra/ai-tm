[[phases]]
name = "QA"
description = "The budgeted, self-fixing mechanical check-phase: static analysis, code style, the test suite, test coverage, the architecture check, the refactor check, the documentation check, the Ponytail over-engineering review, and finally the pre-merge checklist — one concern per task so a failure is individually visible. AI Review and Human Review follow, for checks that must never self-fix."
ai_description = "Run the mechanical checks in this phase, in order. Every task's own max_attempts is 0 — the phase itself carries the retry budget (max_attempts = 3): a failing check is fixed inline and the phase re-runs its full pass until every check is clean or the phase's attempts are spent. Never lower a gate or weaken a test to make a check pass.\n\nThe pre-merge checklist runs last, and the Ponytail review runs immediately before it. That order matters: Ponytail deletes and simplifies code, so it has to finish before the checklist judges the final state, or the checklist's verdict describes code that no longer exists.\n\nWHAT THE TASK STATUS MEANS. A task ends `done` (OK:) only when its check ran and is clean: nothing found, or everything found was fixed inline and verified. A task ends `review` (REVIEW:) when it found something the user has to look at or decide: it stored an 'ask' question, it found a violation it may not fix here, or its verdict rests on a judgement the user should confirm. The dashboard shows review tasks; a done task with an open question hides the finding, so never end a task OK: while an 'ask' question of this task is open. A task ends `skipped` only when the tool it runs does not exist in the project; a check that can be done by reading (the architecture check, the documentation check) is never skipped. FAILED: means the check itself could not run.\n\nWhen a check fixes an issue inline and the fix involved a real choice between reasonable options, record that decision as a 'check' question via tm_question_add — the question states what was hit, and the recommendation is the decision taken — so the user can later confirm it or reverse it; the task may still end OK:, and its result names the check question. An issue whose only sound fix would create a new requirement or an architecture change is not fixed here: store it as an 'ask' question via tm_question_add and end the task REVIEW:, since that call is the user's. Pass the ticket id, the check task's id as `task`, and the model you are running as `model` on every question, and write each self-contained for a cold reader in plain words.\n\nThis phase does not judge requirements traceability and runs no correctness review — those live in AI Review, which runs once, judge-only. Ponytail is the exception and belongs here rather than there: it hunts complexity only, explicitly not correctness, and it fixes as it goes, which is this phase's pattern and not AI Review's.\n\nBasebuilder bundles static analysis, code style, and refactoring in one toolchain from the basebuilder/bb-code-quality package: vendor/bin/bb-quality-fix applies fixes in Rector → ECS → PHPStan order, vendor/bin/bb-quality-check verifies, and the single tools are vendor/bin/bb-phpstan-dry, bb-cs-fix(-dry) and bb-rector(-dry). There are no phpstan.neon, .php-cs-fixer or rector.php files to look for: the configuration lives in that package. Run every quality tool from the host against the worktree, from inside the repository directory, never via docker exec. The integration tests are the one exception: see the Test suite task."
order = 5
max_attempts = 3

[[phases.tasks]]
name = "Static analysis"
description = "Run the project's static analysis (PHPStan). The task fails if it reports any error."
ai_description = "Static analysis is PHPStan, bundled into Basebuilder's bb-quality toolchain alongside code style and refactoring. Run all commands from inside the repo directory (`cd` to it first) — Rector fails silently on the wrong rule set when called from a different working directory. Run `vendor/bin/bb-quality-check` to verify. This task owns the PHPStan (static-analysis) concern: any PHPStan error in the bb-quality-check output fails the task — record it and stop, do not attempt the fix here. Do not raise the baseline or lower the level to make it pass. (bb-quality-fix, run by the Code style and Refactor check tasks, applies Rector/ECS fixes but does not fix PHPStan logic errors.)"
actor = "agent"
max_attempts = 0
order = 1
model = "haiku"

[[phases.tasks]]
name = "Code style"
description = "Check code style (ECS); fix and re-run until clean."
ai_description = "Code style is ECS, bundled into Basebuilder's bb-quality toolchain alongside static analysis and refactoring. Run all commands from inside the repo directory (`cd` to it first) — Rector fails silently on the wrong rule set when called from a different working directory. Run `vendor/bin/bb-quality-fix` to apply all fixes in the correct order (Rector → ECS → PHPStan), then `vendor/bin/bb-quality-check` to confirm. This task owns the ECS (code-style) concern: apply the fixes and re-run bb-quality-fix until bb-quality-check reports no style violations. Do not add suppression comments or skip files to make it pass — fix the actual code."
actor = "agent"
