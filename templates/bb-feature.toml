[[phases]]
name = "Setup"
description = "Set up the workspace for this ticket, so Implementation has a git worktree ready for each repository it touches."
ai_description = "Create the per-ticket workspace before Implementation begins — the detail on how is in this phase's tasks. This is interactive prep done before any grind run: worktree creation needs a git push to create the remote branch and set tracking, and a grind helper agent is not allowed to push (see ai-tm src/Mcp/Tools/GrindTool.php), so these tasks are completed and marked done by hand before an unattended grind run. Do not delete or clean up the ticket directory once created; it persists for later reference."
order = 3
max_attempts = 0

[[phases.tasks]]
name = "Update affected repositories"
description = "For every repository the plan will touch, make its main clone current: confirm it is on its default branch (main/master) with no uncommitted changes, then fetch and fast-forward it to origin. Never leave a main clone on a feature branch. This keeps the main clones a clean, up-to-date reference, so opening one in an IDE shows real, current main/master."
ai_description = "For each repository identified in Planning, operate on the MAIN clone (not a worktree): run git fetch; confirm the clone is on its default branch (main or master) and has no uncommitted changes; then fast-forward it to origin/<default>. Do NOT push. Do NOT switch branches as normal operation. If a clone is on a feature branch, has uncommitted changes, or cannot fast-forward because the local branch has diverged, do not force anything — stop and flag it to the user. Record, per repository, the branch and the before/after commit in this task's result."
actor = "agent"
max_attempts = 0
order = 1
model = "haiku"

[[phases.tasks]]
name = "Create worktrees"
description = "For every affected repository, create the ticket's worktree on the feature branch and push it. Follow docs/workflow.md (Worktree Setup): create the worktree from origin/<default>, push -u to create the remote branch and fix tracking, verify it tracks origin/feature/... (not origin/main or origin/master), and copy the repo's .env into the worktree if it has one. Creating the worktree leaves the main clone on its default branch."
ai_description = "For each affected repository, follow docs/workflow.md Worktree Setup exactly:\n1. git -C <main-clone> worktree add <ticket-workspace>/<repo> -b feature/BBDEV-XXXX-<slug> origin/<default> — checks the feature branch out in the separate worktree directory; the main clone stays on its default branch.\n2. git -C <worktree> push -u origin feature/BBDEV-XXXX-<slug> — creates the remote branch and fixes tracking. (A grind helper agent is not allowed to push, so worktree creation runs before grind, not inside it.)\n3. git -C <worktree> branch -vv — confirm it tracks origin/feature/BBDEV-XXXX-<slug>, NOT origin/main or origin/master. If tracking is wrong, stop and fix it before continuing.\n4. If the main clone has a .env, copy it into the worktree (cp <main-clone>/.env <worktree>/.env).\nRecord each worktree path and its tracking line in this task's result."
actor = "agent"
max_attempts = 0
order = 2
model = "haiku"

[[phases.tasks]]
name = "Wire shared-library for local dev"
description = "When this ticket's workspace includes the shared-library (bb-service-shared) worktree, wire each consuming service in the workspace to use it locally, so edits to the shared library are live and ready. Follow docs/workflow.md, section \"Shared Library → Working on shared-library changes locally\". Set this up by default whenever the shared-library worktree is present; skip only if you clearly know the shared library will not be touched."
ai_description = "For each consuming service worktree (one that requires basebuilder/shared-library), wire its composer to the local bb-service-shared worktree so edits are live:\n1. Add a composer \"path\" repository pointing at ../bb-service-shared, options { \"symlink\": true }, as the FIRST entry in the repositories array.\n2. Set the basebuilder/shared-library constraint to \"@dev\".\n3. composer update basebuilder/shared-library --ignore-platform-reqs (creates the vendor symlink).\n4. git update-index --skip-worktree composer.json composer.lock so the local config never leaks into a commit.\n\nDo this by default whenever the bb-service-shared worktree is part of this ticket's workspace — it is cheap and makes the shared library ready to edit. Skip only if you clearly know the shared library will not be touched. If the bb-service-shared worktree is not in the workspace, there is nothing to wire.\n\nNote: making the branch ready to share (swap the path repo for a real git ref, commit the composer files, then restore the local config) is NOT setup — you do it only before a PR, deploy, or handoff (see docs/workflow.md \"Make the branch ready to share\"), and it needs a push, so it is not a grind step."
actor = "agent"
max_attempts = 0
order = 3
model = "haiku"

[[phases.tasks]]
name = "Create the Docker override"
description = "Create docker-compose.override.yaml in the ticket directory, remapping each affected service's volume mounts to its worktree so the local Docker stack runs this ticket's code. Follow docs/workflow.md, section \"Docker Stack for Ticket Testing\". Always create it; a repo with no matching stack service simply maps nothing."
ai_description = "Create tickets/feature/BBDEV-XXXX-<slug>/docker-compose.override.yaml. For each affected service, remap its volume mounts from basebuilder-stack/services/<svc> to that service's worktree (and to the bb-service-shared worktree if the ticket uses it). The stack then starts with `dkstart <ticket-number>`, which finds this override.\n\nAlways create the file. It lives only in the ticket directory, is not committed, and runs after \"Create worktrees\". Record which services you remapped. (If no affected repo maps to a stack service, a near-empty override is fine.)"
actor = "agent"
max_attempts = 0
