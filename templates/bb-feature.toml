name = "Devil's Advocate review"
description = "Review the implementation plan for suboptimal engineering choices. Deliberately consider alternative approaches that were not taken. For each alternative, evaluate its pros and cons against the chosen approach. If a better approach is found, update the plan; a wording-level improvement is noted, not repaired. The review runs once per attempt — grind's retry budget drives any confirming re-run. Flag any unresolved trade-offs for the human to decide."
