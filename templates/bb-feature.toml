 As the sub-agent reasons, it surfaces every assumption its critique depends on — each thing it takes to be true that the ticket does not itself state — and records one log entry per assumption via tm_log_add with type \"assumption\" and task set to THIS task's own id (task-scoped, not ticket- or phase-scoped). It records every assumption, including ones it believes hold, and it does NOT check them itself: the following verifier task checks them cold, because the agent that stated an assumption is the one least able to see that it is false.\n\nEach assumption is one log entry. Its title is the assumption in one line. Its ai_content is prose following this fixed skeleton, in order: the assumption stated verbatim; its kind — \"fact\" (settled by something already in the repository: code, documentation, data, or a requirement already on the ticket) or \"intent\" (settled only by the user, on a point the requirements never specified); what would settle it (a file path, a document, a requirement id, or \"the user\"); the verdict, left as \"unchecked\" here for the verifier to reach; the evidence, if any is already at hand; the repair made, which is none at this stage; who registered it (this sub-agent and the model it ran as); and the pass number, which is 0 for this Devil's Advocate pass."
