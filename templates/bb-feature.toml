[[phases.tasks]]
name = "Documentation check"
description = "Confirm the documentation this ticket should have updated was actually updated, by comparing the diff against the docs."
ai_description = "Read the ticket's full diff (all commits since the branch diverged from its base branch), across every repository the ticket touched — a Basebuilder ticket may touch more than one repo; check the diff in each. For each change that alters documented behavior — a route or query parameter added/renamed/removed, a public API shape, a CSS class or design-system catalogue entry, an architectural decision, a feature added or removed, a config option, a queue or worker — confirm the matching documentation was updated in the same set of commits, and confirm existing documentation still accurately describes the current code, not just the code as it stood when that documentation was first written — a later commit in the same ticket (a fix from a review, a rename, a guard clause added afterward) can leave earlier documentation stale even when nothing was originally missing.\n\nCheck each touched repo's own docs: its architecture document (the exact path varies by repo — docs/architecture.md or docs/architecture/architecture.md; check which the repo actually uses), README, API docs, and any other docs referenced by that repo's own AGENTS.md. Always check the stack-wide documentation in basebuilder-stack too: docs/modules/<module>.md for every module the ticket touched, and docs/architecture/ where an architectural decision changed. Those stack documents live on basebuilder-stack master, not on the ticket's branch; an uncommitted edit there counts as updated.\n\nA documentation gap is fixed here, not asked about: a wrong or incomplete document is corrected at once, in the repository where the document lives, and the fix is recorded in this task's result. A wording choice is never a question. Only a gap whose fix needs a decision the user has not taken (a new architectural rule, a changed requirement) becomes an 'ask' question via tm_question_add, and then the task ends REVIEW:.\n\nPut the change-to-documentation mapping in this task's result, one line per changed surface, citing the doc file and section that covers it, and note for each whether it needed no change or got a fix."
actor = "agent"
max_attempts = 0
order = 7
model = "sonnet"

[[phases.tasks]]
name = "Ponytail review"
description = "Run the Ponytail over-engineering review against this ticket's changes: what to delete, simplify, or replace with a standard-library or native equivalent. Scoped to the diff, not the full repositories. Clear-cut simplifications are applied in place; anything bigger becomes a question for the user."
ai_description = "Run the ponytail:ponytail-review skill against this ticket's changes — the diff of each feature branch against its base, for every repository in the workspace. Do not review whole repositories; only the changed code is in scope. Ponytail hunts complexity, not correctness: reinvented standard library, unneeded dependencies, speculative abstractions, dead flexibility — one line per finding with location, what to cut, and what replaces it.\n\nThis runs before the pre-merge checklist on purpose. Ponytail changes code, so cutting first means the checklist judges the code that will actually be merged; the other way round, its verdict goes stale the moment a simplification lands.\n\nFollowing this phase's self-fixing practice: apply the clear-cut simplifications (dead code, a reinvented standard-library call, an unused abstraction), and record what was applied and what was intentionally left in this task's result. Re-run the quality tools and the test suites from the host afterwards, never via docker exec.\n\nA simplification that would change the architecture, an interface other code depends on, or a requirement is not applied here — store it as an 'ask' question via tm_question_add (the ticket id, this task's id as `task`, the model you are running as `model`, self-contained for a cold reader with your recommendation) and leave the call to the user. Zero findings is a valid outcome."
actor = "agent"
max_attempts = 0
order = 8
model = "sonnet"

