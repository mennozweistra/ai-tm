[[phases.tasks]]
name = "Colleague functional test"
description = "A colleague runs the feature and confirms it works as expected. This task is for a colleague — the AI does not complete it."
ai_description = "Do not mark this task done — it is a colleague's hands-on check that the feature works. Leave it for the colleague."
actor = "human"
max_attempts = 0
order = 4

[[phases]]
name = "Release"
description = "Get the finished, reviewed feature out. Confirm everything is committed and pushed, prepare the environment variables the feature needs, bring the feature branches up to date with the base branch, optionally deploy the feature branch for a final look, then merge to master and deploy to production. Merging and production deployment are the user's calls."
ai_description = "Perform the release tasks in order. Steps that change shared state — merging base updates into feature branches (which pushes), merging to master, deploying to production — are never unprompted; do them only on the user's explicit go-ahead. Documentation updates happen earlier, as the last Implementation task, and are checked in QA before this phase runs — nothing to do here for docs."
order = 8
max_attempts = 0

[[phases.tasks]]
name = "Final commit and push"
description = "Confirm everything is committed and the branch is pushed to the remote: the working tree is clean and nothing local is left behind."
ai_description = "git status clean; all feature changes committed with messages naming the ticket; the branch pushed to the remote (origin). Always applies, every project."
actor = "agent"
max_attempts = 0
order = 1
model = "haiku"

[[phases.tasks]]
name = "Environment variables to share"
description = "List the new or changed environment variables the feature needs, with a note on each."
ai_description = "Compile the list of environment variables this feature introduces or changes, each with a short note on what it is for, so the user can add them to the staging and production environments. Put the list in this task's result."
actor = "agent"
max_attempts = 0
order = 2
model = "haiku"

[[phases.tasks]]
name = "Merge main-branch updates into all feature branches and update lockfiles"
description = "Bring every feature branch up to date with the latest base branch and refresh its lockfiles before the production merge. This is a shared-state, push-bearing step — only on the user's explicit go-ahead."
ai_description = "For each repository's worktree involved in the ticket: fetch and merge the current main/master into the feature branch, resolve any conflicts, and update the lockfiles (composer.lock / pnpm-lock.yaml) so the branch builds against current dependencies. For a ticket that touched bb-service-shared, also make the branch ready to share — repoint the committed composer.json at a real shared-library git ref rather than the local path repo (see docs/workflow.md \"Make the branch ready to share\"), commit the composer files, then restore the local dev config. Push each updated branch. This step changes shared state and needs a git push, so do it only on the user's explicit go-ahead — never unprompted."
actor = "human"
max_attempts = 0
order = 3

[[phases.tasks]]
name = "Deploy feature branch to a review environment (optional)"
description = "Optionally deploy the feature branch somewhere for a final look before merging."
ai_description = "If the project has a review or staging deployment for feature branches, deploy this branch there and confirm the feature works as intended. If the project has no such environment, skip this task."
actor = "human"
max_attempts = 0
order = 4

[[phases.tasks]]
name = "Merge to master and deploy to production"
description = "Merge the feature branch and deploy to production. The user's call."
ai_description = "Once the user approves, merge the feature branch to master/main and deploy to production following the project's deployment process. Do not merge or deploy to production without the user's explicit go-ahead."
actor = "human"
max_attempts = 0
order = 5

[[phases.tasks]]
name = "Verify the merge and close the ticket"
description = "Confirm the earlier merge task actually landed on master before this ticket is allowed to close."
ai_description = "For every repo this ticket has a worktree for: check whether the ticket's branch has any commits (git log <branch> vs its base). A worktree created but never committed to needs no check — skip it. For every repo with real commits, verify master actually contains them: `git rev-list --count master..<branch>` must be 0 (every commit on the branch is already in master), not just that the earlier 'Merge to master and deploy to production' task was marked done — a task can be marked done by mistake without the merge having happened. If a remote exists, also confirm master is not ahead of its pushed state (`git rev-list --count origin/master..master` is 0). If any repo fails either check, do not mark this task done: report FAILED, name the exact repo and branch that is not merged or not pushed, and stop — the ticket must not close until a human completes the actual merge. Only when every touched repo passes does this task close, and with it the ticket."
actor = "agent"
max_attempts = 0
order = 6
model = "haiku"