[[phases.tasks]]
name = "AI functional review"
description = "Run the feature and verify it actually works against the requirements: drive the user interface in a real browser and exercise the API endpoints, confirming each requested behaviour functions end to end. Findings go in the result; a functional failure means recording it and stopping here."
ai_description = "Start the application with the project's run/dev command. Exercise the feature end to end against the requirements: drive the user interface in a real browser with Playwright, and call the REST endpoints directly where the feature exposes them. Confirm each requested behaviour actually works when run — not merely that the tests pass. If the diff adds or changes a pointerdown/pointerup/click/mousedown/touch handler on an interactive element, exercise it twice: once with normal mouse-driven interaction, and once with Playwright touch emulation (hasTouch: true, isMobile: true, using page.tap()) — pointer events fire identically for mouse and touch unless the code explicitly branches on event.pointerType, so mouse-only testing does not prove touch works (BBDEV-2320). Record what you exercised and the per-requirement outcome, including the touch pass/fail where applicable, in this task's result; a functional failure means recording it and stopping here, not attempting the fix. Leave the application running when you finish so the human functional review that follows can start immediately. Performed by a clean Claude Code agent now; designed to be delegated later to another AI with browser control."
actor = "agent"
max_attempts = 0
order = 2
model = "sonnet"

[[phases.tasks]]
name = "AI code review"
description = "A fresh-context agent of our own reviews the ticket's whole diff for correctness and subtle bugs, architecture and convention adherence, readability and test quality. This runs before the external tools, so our own eyes are first, not last."
ai_description = "Review the complete set of changes this ticket made — the diff of each feature branch against its base, across every repository in the workspace — with fresh eyes and no assumption that earlier tasks got it right.\n\nRead the project's own rules first: AGENTS.md, CLAUDE.md, docs/architecture/target-state.md, and the docs/modules/ page for each bounded context the diff touches. Those documents are the authority; existing code may be drift.\n\nHunt what the mechanical QA tasks structurally cannot:\n- Correctness and subtle bugs. Give every branch, loop, boundary and arithmetic expression its own pass. Feed each new function its degenerate inputs on paper — an empty collection, a zero, a negative number, an inverted range, a value one past a limit, a null — and say what it actually returns. A guard that silently produces a wrong answer instead of failing is the highest-value finding here.\n- Adherence to the documented architecture and conventions, including exception root-cause categories and log levels.\n- Readability and maintainability for someone meeting the code cold.\n- Test quality: does each test assert behaviour a requirement cares about, and would it fail if the logic broke? Tests that mirror the implementation's internals prove nothing.\n\nScope is code this ticket changed. Decide newness with git diff origin/<base>...HEAD, never blame or dates. Pre-existing problems on the base branch are out of scope.\n\nWrite every finding into this task's result grouped by severity, each with file and line, the concrete input or state that triggers it, and what goes wrong. Following this phase's fix-in-place practice: fix the clear-cut ones, commit them, and record what was fixed and what was left. A finding whose fix would change the architecture, an interface other code depends on, or a requirement is not fixed here — store it as an 'ask' question via tm_question_add (the ticket id, this task's id as `task`, the model you are running as `model`, self-contained for a cold reader, with your recommendation) and leave the call to the user.\n\nRun the quality tools and test suites from the host afterwards, never via docker exec. Finding nothing is a valid outcome; say so plainly rather than inventing a finding to look thorough."
actor = "agent"
max_attempts = 0
order = 3
model = "opus"

[[phases.tasks]]
name = "AI code review - Gemini"
description = "Run /code-review-briefing to generate CODE_REVIEW.md in the ticket directory. This file is the input for an external Gemini code review. The task is done when CODE_REVIEW.md exists and covers all repositories in the workspace."
ai_description = "Run the /code-review-briefing skill. It reads the active ticket from tm, collects the git diff for each repository in the workspace, adds surrounding context for significant changes, and writes CODE_REVIEW.md to the ticket directory. Confirm the file exists and is not empty before marking this task done. If the diff adds or changes a pointerdown/pointerup/click/mousedown/touch listener on an interactive element, call this out explicitly in CODE_REVIEW.md's context notes — whether it branches on event.pointerType where mouse and touch must behave differently — so the external Gemini reviewer's attention is drawn to it (pointer events fire identically for mouse, touch, and pen unless the code guards for it; BBDEV-2320 shipped broken on touch because nothing flagged this). Do not send the file anywhere — the user handles the Gemini review step externally."
