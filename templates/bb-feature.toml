model = "haiku"

[[phases.tasks]]
name = "Refactor check"
description = "Check for automated refactor/modernization suggestions (Rector); apply and re-run until clean."
ai_description = "Refactoring is Rector, bundled into Basebuilder's bb-quality toolchain alongside static analysis and code style. Run all commands from inside the repo directory (`cd` to it first) — Rector fails silently on the wrong rule set when called from a different working directory. Run `vendor/bin/bb-quality-fix` (which runs Rector first) to apply the suggested changes, then `vendor/bin/bb-quality-check` to confirm. This task owns the Rector (automated refactor/modernization) concern: apply and re-run until bb-quality-check reports no further Rector changes. Do not skip files or lower a rule to make it pass."
