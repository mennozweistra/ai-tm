ai_description = "Do not mark this task done — it is the user's hands-on check that the feature works and matches intent. For a user interface the user opens it in a browser; for an API the user exercises the endpoints. Start the application with the project's run/dev command before handing over, so the user can begin at once; this template runs no AI functional review, so nothing else leaves it running. Leave this task for the user."
