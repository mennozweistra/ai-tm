[[phases.tasks]]
name = "Grind-compatibility review"
description = "Review each task just created for downstream execution and verify it is grind-compatible: the task description must contain enough context for an independent subagent to execute it without access to prior conversation history."
ai_description = "IMPORTANT: Assume the workspace (git worktrees) has already been created by the time these tasks run. Do NOT treat the absence of a worktree on disk as a task defect — it will exist by the time these tasks execute. The grind-compatibility test is about whether the task's text is self-contained and gives a fresh subagent everything it needs, not about whether the current filesystem matches the task's expectations. Do NOT change a task's working directory from a worktree path to the main checkout path — a worktree will exist by then.\n\nRead each task just created. For each task, ask: could a fresh agent execute this task using only what is written in the task's name, description, and ai_description — with no access to this conversation or the other planning tasks? Check that each task names its source requirement, describes the work concretely, and does not rely on context that only exists in the conversation history. Fix any task that fails this check by rewriting its description to be self-contained. Record which tasks you changed and why."
