ai_description = "Open .claude/commands/pre-merge-check.md in the basebuilder-stack repo, go through every rule, do what it says, record each result, and write the report file it prescribes in the ticket directory. Where the checklist references rules from the architecture document, check against those too. Any failed rule fails the task, also a rule that fails on code older than the ticket: a rule scans what it says it scans, and \"pre-existing\" is not a reason to set a failure aside. A failure that is not the user's call is fixed inline; one that is the user's call is stored as an 'ask' question via tm_question_add and the task ends REVIEW:. Two rules need care: \"No open Flappie issues\" is satisfied when every CodeRabbit comment on the ticket's pull requests has a reply recording its disposition, even without a CODERABBIT_REVIEW.md file; \"Bitbucket pipeline passed\" is checked against the pushed feature branch via the Bitbucket MCP tool as the rule describes, and a branch not yet pushed is pushed first."
actor = "agent"
max_attempts = 0
