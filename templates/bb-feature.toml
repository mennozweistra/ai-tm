ai_description = "Run the /code-review-workspace skill. It finds all repositories under the ticket's workspace/, runs the coderabbit:code-reviewer agent against each one, and writes CODERABBIT_REVIEW.md to the ticket directory. After the review is written: read every Critical and High finding, apply fixes, commit them, and record what was fixed and what was intentionally left in this task's result. Additionally, independently of what CodeRabbit itself flags: if the diff adds or changes a pointerdown/pointerup/click/mousedown/touch listener on an interactive element, check whether it needs to (and does) branch on event.pointerType (or an equivalent input-type check) — pointer events fire identically for mouse, touch, and pen by design, so code that assumes one input method without gating on pointerType silently misbehaves on the others (BBDEV-2320). Treat a missing gate as a finding of your own even if CodeRabbit did not surface it. Do not move on until no Critical or High finding remains open."
