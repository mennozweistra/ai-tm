ai_description = "Do not mark this task done — it is the user's review of the code. When the user is ready to start, run the /human-code-review command: it opens a frozen side-by-side diff page per repository in his browser, records his spoken comments verbatim in a numbered list, answers discussion inline, fixes and commits each accepted comment locally, and moves to the next repository only on his say-so. He may instead review on the Bitbucket pull request or in the IDE if he prefers. He approves the PR when satisfied. Leave the task's completion to him."
