description = "This is the default Basebuilder feature template. It carries the lighter flow that ticket 80 recommended and Menno approved. Twelve steps stand between the start of a ticket and Menno's own code review. The remaining checks run after his review, as improvement rounds that each fire only on their own trigger. The full pipeline stays available as bb-feature-full, for a ticket that needs every check before the human review. Menno's rule governs changes to this template: a removed step comes back only when a ticket shows that it is missing."
ai_description = "Work the phases in order: Discovery, Planning, Setup, Implementation, Gate, Pull request, Human Review, Improvement rounds, Release preparation, Colleague review, Deploy. Do not start a phase until the previous one is complete. Discovery gathers the requirements as requirement entities on the ticket. Planning creates the Implementation tasks and decides which repositories the ticket touches. Setup reads the repository list from Planning's result and creates a git worktree for each touched repository. Implementation builds the feature. The Gate phase carries a retry budget of three passes and fixes its own failures inline. A change request from a human becomes a new Implementation task, the Gate re-runs from a clean pass, and the code returns to the Human Review phase. Each task in the Improvement rounds phase checks its own trigger first and sets itself to status \"skipped\" when the trigger did not fire. Every deploy waits for the colleague's sign-off. Any step that changes shared state needs Menno's explicit go-ahead. See each phase for its own rules."

[[phases]]
name = "Discovery"
description = "Work out what the feature must do, and capture it as requirement entities on the ticket. This phase runs before Planning: it produces the specification that Planning turns into work. The requirements it produces are displayed in the ticket's Requirements section, not inside this phase."
ai_description = "Discovery is the requirements-gathering process. Its output is the ticket's requirement entities (the standing specification); the phase produces them but does not contain them, the same way Implementation produces code that lives in the repo. Run the tasks in this phase in order. Do not proceed to Planning until Discovery's questioning step has happened or the user has explicitly declined it. Do not start planning or implementation from inside this phase."
order = 1
max_attempts = 0

[[phases.tasks]]
name = "Brainstorm and capture the requirements"
description = "Talk through what the feature should do. This is the open, human-led part — you lead the conversation, the AI listens and sharpens. As each requirement becomes clear, it is captured as a requirement entity on the ticket."
ai_description = "This is the human-led, free-form half of gathering requirements. The user drives an open conversation about what the feature must do; your job is to listen, reflect back, sharpen, and capture each requirement that emerges as a requirement entity on the ticket via tm_requirement_add. Write each requirement as a discrete, individually verifiable statement. Do not start planning or implementation. Do not rush ahead — capture, do not build.\n\nBB reminder: if a requirement involves an interactive control (toggle, drag, custom click/touch/pointer handler), capture touch-input parity (\"identical behaviour on touch input as on mouse\") as its own explicit, individually verifiable requirement line — do not leave it implied by the general behaviour requirement (BBDEV-2320: a fix verified only on mouse shipped broken on touch)."
actor = "human"
max_attempts = 0
order = 1

[[phases.tasks]]
name = "Run a grill session to close the gaps"
description = "The AI now asks questions, each with a recommended answer, to surface the decisions, edge cases, and boundaries the free-form conversation missed. Light questions, where the architecture or the code already points to one clear answer, come as one numbered batch: reply with the numbers you want to discuss and the rest are accepted. Questions whose answer genuinely shapes the design come one per turn. Requirements are added or sharpened as the answers come in."
ai_description = "Call `tm_grill` with the ticket id and follow the protocol it returns. Do not improvise a question sequence from memory — the protocol is the only correct entry point for this interview. The tool will guide you through reading the ticket, exploring the codebase in a sub-agent, conducting the interview in two gears — light questions in one numbered batch the user can accept or pick from, heavy questions one per turn, each with a recommended answer — storing every question as a question entity the moment it is presented and resolving it in the same turn the user answers, and writing requirements live as alignment is reached. The interview closes once requirements are settled."
actor = "agent"
max_attempts = 0
order = 2
model = "sonnet"

[[phases.tasks]]
name = "Devil's Advocate review"
description = "Review the requirements captured on the ticket for gaps, contradictions, or ambiguity. Deliberately consider alternative interpretations or scope boundaries that were not considered. For each gap or ambiguity found, evaluate how it should be resolved. A finding that would change what gets built is repaired in the requirements; anything smaller is noted, not repaired. The review runs once per attempt — grind's retry budget drives any confirming re-run. Flag any unresolved trade-offs or genuinely ambiguous decisions for the human to decide."
ai_description = "Run this review in a fresh sub-agent, not in the current context — instruct it to fetch the requirements captured so far itself via tm_requirement_list (and the ticket via tm_ticket_show for context) rather than passing them as a chat dump, so its judgement is not biased by the thinking that produced them. Have it challenge the requirements: what gaps, contradictions, or ambiguities remain? Are there alternative interpretations of scope that were not considered? For each issue it identifies, it should write a short comparison of the alternatives. Repair the requirements via tm_requirement_add / tm_requirement_set only for a finding that would change what gets built: a wrong fact an implementer would build from, a contradiction between requirements, a missing requirement whose absence changes scope. A finding below that bar — wording, structure, polish — goes into the review write-up (or a question, if it deserves the user's eye) and is not repaired. You run exactly once: grind's retry budget decides whether a confirming pass follows, so do not loop yourself.\n\nDo not write the findings to a markdown file. Return the full review write-up — the gaps and ambiguities considered, the comparisons, and the grounds for the final verdict — as this task's summary, so it is stored in the task's ai_result field and stays searchable in the database; keep the first line a concise summary for the result field. The write-up is an auditable justification — assumptions, evidence, verdict — not a transcript of private chain-of-thought; do not include one. Every unresolved trade-off or genuinely ambiguous decision the review flags for the human — one it cannot settle itself by sharpening the requirements — is stored as a question entity via tm_question_add the moment it arises: kind 'ask', the ticket id, this task's id as `task`, and the model you are running as `model`. Write it self-contained for a cold reader who was not in this review — in plain words, saying when the issue comes up and how it unfolds, inventing no shorthand for things the user never named — and put the resolution you recommend and its reason in `recommendation`. Do not leave such a decision only in the summary or in chat, and do not defer writing it.\n\nBeyond the review and findings work described above, this task also states the working assumptions behind the review, so the separate verifier task that follows can check them cold. While reviewing, the sub-agent lists every assumption the review depends on — each thing it takes to be true that the ticket does not itself state — and records one log entry per assumption via tm_log_add with type \"assumption\" and task set to THIS task's own id (task-scoped, not ticket- or phase-scoped). It records every assumption, including ones it believes hold, and it does NOT check them itself: the following verifier task checks them cold, because the agent that stated an assumption is the one least able to see that it is false.\n\nEach assumption is one log entry. Its title is the assumption in one line. Its ai_content is prose following this fixed skeleton, in order: the assumption stated verbatim; its kind — \"fact\" (settled by something already in the repository: code, documentation, data, or a requirement already on the ticket) or \"intent\" (settled only by the user, on a point the requirements never specified); what would settle it (a file path, a document, a requirement id, or \"the user\"); the verdict, left as \"unchecked\" here for the verifier to reach; the evidence, if any is already at hand; the repair made, which is none at this stage; who registered it (this sub-agent and the model it ran as); and the pass number, which is 0 for this Devil's Advocate pass."
actor = "agent"
max_attempts = 3
order = 3
model = "opus"

[[phases.tasks]]
name = "Verify the review's assumptions"
description = "Check the assumptions the preceding Devil's Advocate task recorded. A fresh agent reads each assumption cold from the log, classifies it as a fact (settled by the repository) or the user's intent (settled only by the user), checks the fact assumptions — repairing only those whose falsity would change what gets built — and stops the ticket for the user on any intent assumption. A pass after the first confirms the previous pass's repairs. Every verdict is written back as a log entry. Bounded by the task's retry budget."
ai_description = "Run this in a fresh sub-agent. Its job is to check, cold, the assumptions the preceding Devil's Advocate task stated — the agent that stated an assumption is the one least able to see it is false, so a separate agent checks them.\n\nFind the Devil's Advocate task by POSITION, never by name: it is the task immediately preceding this one in this same phase. Task names are template-defined and renamable, so name-matching is fragile — use tm_task_list on this phase and take the task one order position before this one. In this Discovery phase the order is brainstorm, grill, Devil's Advocate, this verifier, so the task immediately before this one is the Devil's Advocate review.\n\nRead the assumption log entries with tm_log_list: read the preceding Devil's Advocate task's entries (task-scoped to that task) and this task's own entries — a previous pass of this verifier may have added some (see the repair rule below). Consider only entries of type \"assumption\". Where more than one entry exists for the same assumption because passes have appended entries, treat the latest entry for that assumption as the current one.\n\nClassify each assumption as one of two kinds:\n- \"fact\" — settled by something already in the repository: code, documentation, data, or a requirement already on the ticket. You check this kind yourself.\n- \"intent\" — settled only by the user, on a point the requirements never specified. You never settle this kind by argument and never quietly accept it.\nThe same sentence can be either: a claim already written as a requirement on the ticket is a fact you confirm; the identical sentence stated only as an assumption, that nobody specified, is a guess at the user's intent.\n\nFor each fact assumption, check it yourself against the repository. Repair a falsified assumption only when leaving it would change what gets built; a harmless imprecision is recorded in its verdict entry and left alone. In this Discovery phase the repair is to the requirements: fix them via tm_requirement_add / tm_requirement_set. When a repair rests on a new assumption of your own, write that new assumption as a new \"assumption\" log entry on THIS task (task set to this task's own id), so the next pass — a fresh sub-agent that remembers nothing of this one — checks it cold.\n\nNever guess an intent assumption. The moment you find one, this task fails: make no repair for it, stop, and write this task's result summary beginning with the token FAILED: (the token grind reads), naming the assumption and the exact question the user must answer to settle it. grind then halts the ticket and the user answers. This rule applies here in Discovery exactly as it does in Planning.\n\nRecord every verdict, not only the failures. For each assumption you reach a verdict on, write an \"assumption\" log entry on THIS task with the fixed skeleton below — both the assumptions that held and the ones that did not — so a later cross-ticket analyzer has a baseline as well as the falsified ones.\n\nWrite no markdown findings file. Your findings live only in the assumption log entries and in this task's result field; a second copy in a file would drift from the log.\n\nEach assumption log entry has title = the assumption in one line, type = \"assumption\", task = this task's own id, and ai_content written as prose following this fixed skeleton, in order: the assumption stated verbatim; its kind (\"fact\" or \"intent\"); what would settle it (a file path, a document, a requirement id, or \"the user\"); the verdict (\"verified\", \"falsified\", or \"needs-user\"); the evidence for that verdict; the repair made, if any; who registered it (this sub-agent and the model it ran as); and the pass number.\n\nThis is a self-contained budgeted task. grind's protocol re-runs it under its max_attempts budget — a fresh sub-agent each pass — and a pass after the first confirms the previous pass's repairs rather than re-verifying the whole list (the CHECK BUDGET block in your prompt carries the rule). It ends when a pass repairs nothing or the budget is spent. Do not implement any loop yourself: state this pass's verdicts and repairs and stop."
actor = "agent"
max_attempts = 3
order = 4
model = "opus"

[[phases]]
name = "Planning"
description = "Turn the requirements into an implementation plan and a release plan, and decide which repositories this ticket touches. You may rename the Implementation phase, and you may insert extra phases — but only between Planning and the Gate."
ai_description = "Produce the Implementation-phase task breakdown and the release plan, and decide which repositories the ticket touches — the detail on how is in this phase's planning task. This phase holds one task. You may rename the Implementation phase to something feature-specific and you may add extra phases, but any added phase goes after Planning and before the Gate. Do not proceed to Setup until Planning is complete."
order = 2
max_attempts = 0

[[phases.tasks]]
name = "Plan the implementation and release"
description = "Read the requirements and the project's architecture, then create the Implementation tasks, each naming the requirement it serves where applicable. Decide which repositories the ticket touches — a repository is touched if the ticket edits files in it, or if it is a local path/workspace dependency (for example a composer.json \"type\": \"path\" entry, or an npm workspace/file: dependency) of a repository being edited, since that dependency needs its own worktree too even though its source is never edited directly. Name the touched repositories as a plain list in this task's result: the single Setup task reads that list. The Release preparation and Deploy phases already carry their tasks; add a release step to them only where this project needs one those phases do not have (for example tag and publish)."
ai_description = "Inputs: the ticket's feature description and the requirement entities on the ticket. Read the project's architecture document under docs/ first — the plan must fit it; if it can't, store it as an 'ask' question via tm_question_add the moment it arises (kind 'ask', the ticket id, this task's id as `task`, the model you are running as `model`, a cold-reader question in plain words with your recommended resolution in `recommendation`) instead of planning around it. Create each Implementation-phase task with a clear name, a description of the work, and a reference to its source requirement in the description (or \"from the feature description\" if there were no formal requirements). Break the work down for a good implementation, not to mirror the requirement count — split large requirements into several tasks, group trivial ones.\n\nWrite each task at the altitude of intent: what it must achieve, where to look, and which requirement it serves. Do not bake field-level facts into the plan text — a specific the implementer will verify cheaply against the real system (a field name, an endpoint's exact shape, a library detail) belongs to the implementing task's own work, not to the plan, unless a requirement fixes it. A plan that hardcodes such facts turns the later reviews into prose-verification of claims no test can check.\n\nInclude, among the Implementation tasks, a task that creates or updates any documentation the feature changes — the architecture document, README, API docs, and any other docs referenced by the project's AGENTS.md. This covers both editing an existing doc to reflect a change and writing a new doc or section when the feature introduces something with no existing coverage. Place it as the last Implementation task, since it needs to see the complete diff to know what changed. This is not optional busywork: the Documentation check improvement round will send the ticket back if a documented surface changed without a matching doc update, so an omitted or incomplete documentation task here comes back to Implementation anyway — plan it in up front instead.\n\nIdentify which repositories the ticket touches and write them out as a plain list in this task's result, one line per repository. The Setup phase holds a single task that reads that list and creates a worktree for each repository it names, so a repository missing from the list gets no worktree. A repository is touched if (a) the ticket edits files in it, or (b) it is a local path/workspace dependency of a repository being edited — check the composer.json (\"repositories\" entries of \"type\": \"path\") or package.json (workspace/\"file:\" dependencies) of every repository from (a) and include any such dependency repos even though the ticket never edits their source directly. In this stack, a service that requires basebuilder/shared-library depends on bb-service-shared this way, so touching such a service always means bb-service-shared needs its own worktree too.\n\nThe Release preparation, Colleague review and Deploy phases already carry their tasks, so there is normally nothing to create for the release. Add a task to Release preparation or Deploy only where this project needs a release step those phases do not already have (for example tag and publish, or a push to an extra remote), and leave any shared-state step (merge to master, publish, deploy to production) gated on the user's explicit go-ahead.\n\nWhen creating each Implementation task, also set its `model` field: pick the cheapest model capable of doing the task well, judged from that task's own name and description. Use `haiku` for simple, mechanical steps (renames, formatting, single-line config edits, running an existing scripted check). Use `sonnet` for typical implementation or review work needing ordinary engineering judgment — most tasks land here. Use `opus` only where the task's own difficulty genuinely needs it (deep architectural reasoning, ambiguous requirements needing careful synthesis, a step likely to need retries). Pass the picked value as the `model` argument to `tm_task_add` when creating the task, so it does not fall through to grind's own null-model fallback at execution time.\n\nRecord the plan's shape and any decisions in this task's result; put any architectural decision in the architecture document too."
actor = "agent"
max_attempts = 0
order = 1
model = "opus"

[[phases]]
name = "Setup"
description = "Set up the workspace for this ticket, so Implementation has a git worktree ready for each repository it touches."
ai_description = "Create the per-ticket workspace before Implementation begins — the detail on how is in this phase's single task. This is interactive prep done before any grind run: worktree creation needs a git push to create the remote branch and set tracking, and a grind helper agent is not allowed to push (see ai-tm src/Mcp/Tools/GrindTool.php), so this task is completed and marked done by hand before an unattended grind run. Do not delete or clean up the ticket directory once created; it persists for later reference."
order = 3
max_attempts = 0

[[phases.tasks]]
name = "Create the ticket workspace and worktrees"
description = "Read the list of touched repositories from the Planning task's result, then do all four setup steps in this order.\n\n1. Update affected repositories. For every repository the plan will touch, make its main clone current: confirm it is on its default branch (main/master) with no uncommitted changes, then fetch and fast-forward it to origin. Never leave a main clone on a feature branch. This keeps the main clones a clean, up-to-date reference, so opening one in an IDE shows real, current main/master.\n\n2. Create worktrees. For every affected repository, create the ticket's worktree on the feature branch and push it. Follow docs/workflow.md (Worktree Setup): create the worktree from origin/<default>, push -u to create the remote branch and fix tracking, verify it tracks origin/feature/... (not origin/main or origin/master), and copy the repo's .env into the worktree if it has one. Creating the worktree leaves the main clone on its default branch.\n\n3. Wire shared-library for local dev. When this ticket's workspace includes the shared-library (bb-service-shared) worktree, wire each consuming service in the workspace to use it locally, so edits to the shared library are live and ready. Follow docs/workflow.md, section \"Shared Library → Working on shared-library changes locally\". Set this up by default whenever the shared-library worktree is present; skip only if you clearly know the shared library will not be touched.\n\n4. Create the Docker override. Create docker-compose.override.yaml in the ticket directory, remapping each affected service's volume mounts to its worktree so the local Docker stack runs this ticket's code. Follow docs/workflow.md, section \"Docker Stack for Ticket Testing\". Always create it; a repo with no matching stack service simply maps nothing."
ai_description = "Read the touched-repository list from the Planning phase's \"Plan the implementation and release\" task result (tm_task_show). That list is the input for every step below. Do the four steps in the order given.\n\nSTEP 1 — UPDATE AFFECTED REPOSITORIES.\nFor each repository identified in Planning, operate on the MAIN clone (not a worktree): run git fetch; confirm the clone is on its default branch (main or master) and has no uncommitted changes; then fast-forward it to origin/<default>. Do NOT push. Do NOT switch branches as normal operation. If a clone is on a feature branch, has uncommitted changes, or cannot fast-forward because the local branch has diverged, do not force anything — stop and flag it to the user. Record, per repository, the branch and the before/after commit in this task's result.\n\nSTEP 2 — CREATE WORKTREES.\nFor each affected repository, follow docs/workflow.md Worktree Setup exactly:\n1. git -C <main-clone> worktree add <ticket-workspace>/<repo> -b feature/BBDEV-XXXX-<slug> origin/<default> — checks the feature branch out in the separate worktree directory; the main clone stays on its default branch.\n2. git -C <worktree> push -u origin feature/BBDEV-XXXX-<slug> — creates the remote branch and fixes tracking. (A grind helper agent is not allowed to push, so worktree creation runs before grind, not inside it.)\n3. git -C <worktree> branch -vv — confirm it tracks origin/feature/BBDEV-XXXX-<slug>, NOT origin/main or origin/master. If tracking is wrong, stop and fix it before continuing.\n4. If the main clone has a .env, copy it into the worktree (cp <main-clone>/.env <worktree>/.env).\nRecord each worktree path and its tracking line in this task's result.\n\nSTEP 3 — WIRE SHARED-LIBRARY FOR LOCAL DEV.\nFor each consuming service worktree (one that requires basebuilder/shared-library), wire its composer to the local bb-service-shared worktree so edits are live:\n1. Add a composer \"path\" repository pointing at ../bb-service-shared, options { \"symlink\": true }, as the FIRST entry in the repositories array.\n2. Set the basebuilder/shared-library constraint to \"@dev\".\n3. composer update basebuilder/shared-library --ignore-platform-req=ext-redis --ignore-platform-req=ext-mongodb, on the host (creates the vendor symlink). This is the one composer command that runs on the host: the path repository points outside the service directory, and bb-composer mounts only the service directory. The lock it produces is local only and is never committed (docs/composer.md, \"Limit: path repositories\").\n4. git update-index --skip-worktree composer.json composer.lock so the local config never leaks into a commit.\n\nDo this by default whenever the bb-service-shared worktree is part of this ticket's workspace — it is cheap and makes the shared library ready to edit. Skip only if you clearly know the shared library will not be touched. If the bb-service-shared worktree is not in the workspace, there is nothing to wire.\n\nNote: making the branch ready to share (swap the path repo for a real git ref, re-lock with bb-composer, commit the composer files, then restore the local config) is NOT setup — you do it only before a PR, deploy, or handoff (see docs/workflow.md \"Make the branch ready to share\"), and it needs a push, so it is not a grind step.\n\nSTEP 4 — CREATE THE DOCKER OVERRIDE.\nCreate tickets/feature/BBDEV-XXXX-<slug>/docker-compose.override.yaml. For each affected service, remap its volume mounts from basebuilder-stack/services/<svc> to that service's worktree (and to the bb-service-shared worktree if the ticket uses it). The stack then starts with `dkstart <ticket-number>`, which finds this override.\n\nAlways create the file. It lives only in the ticket directory, is not committed, and runs after the worktrees exist. Record which services you remapped. (If no affected repo maps to a stack service, a near-empty override is fine.)"
actor = "agent"
max_attempts = 0
order = 1
model = "sonnet"

[[phases]]
name = "Implementation"
description = "Do the work. The tasks here were created by the Planning phase; each names the requirement it serves. Build on a feature branch, follow the project's architecture document, keep the code consistent with what's already there. This phase ships empty in the template — Planning fills it."
ai_description = "Implement the tasks in this phase, in order. Each task names its source requirement — build exactly what that requires, no more. Follow the project's architecture document under docs/; if you hit a situation the architecture doesn't cover, stop and raise it with the user rather than inventing a pattern. Write tests alongside the code per the project's testing conventions. Work on a feature branch. Record what you did, and any decisions taken along the way, in each task's result. If the plan turns out to be wrong, return to Planning rather than improvising. This phase is empty until Planning populates it."
order = 4
max_attempts = 0
tasks = []

[[phases]]
name = "Gate"
description = "The budgeted, self-fixing check phase: code quality, the test suite, requirements traceability, the AI code review, and finally the pre-merge checklist — one concern per task so a failure is individually visible. Human Review follows, for the checks that must never self-fix."
ai_description = "Run the checks in this phase, in order. Every task's own max_attempts is 0 — the phase itself carries the retry budget (max_attempts = 3): a failing check is fixed inline and the phase re-runs its full pass until one full pass is clean or the phase's attempts are spent, three passes at most. Never lower a gate or weaken a test to make a check pass.\n\nThe pre-merge checklist runs last. That order matters: the earlier checks change code, so they have to finish before the checklist judges the final state, or the checklist's verdict describes code that no longer exists.\n\nWHAT THE TASK STATUS MEANS. A task ends `done` (OK:) only when its check ran and is clean: nothing found, or everything found was fixed inline and verified. A task ends `review` (REVIEW:) when it found something the user has to look at or decide: it stored an 'ask' question, it found a violation it may not fix here, or its verdict rests on a judgement the user should confirm. The dashboard shows review tasks; a done task with an open question hides the finding, so never end a task OK: while an 'ask' question of this task is open. A task ends `skipped` only when the tool it runs does not exist in the project; a check that can be done by reading is never skipped. FAILED: means the check itself could not run.\n\nWhen a check fixes an issue inline and the fix involved a real choice between reasonable options, record that decision as a 'check' question via tm_question_add — the question states what was hit, and the recommendation is the decision taken — so the user can later confirm it or reverse it; the task may still end OK:, and its result names the check question. An issue whose only sound fix would create a new requirement or an architecture change is not fixed here: store it as an 'ask' question via tm_question_add and end the task REVIEW:, since that call is the user's. A requirement-level or architecture-level issue therefore stops the pass rather than being repaired inside it. Pass the ticket id, the check task's id as `task`, and the model you are running as `model` on every question, and write each self-contained for a cold reader in plain words.\n\nTwo tasks in this phase are judge-only and never self-fix their own subject: requirements traceability and the AI code review's requirement-level findings. Inside this Gate an unmet requirement is recorded as an 'ask' question and fails the pass. The AI code review is the only task in this template whose job is hunting correctness bugs by reading the diff; nothing else does that, so give it the effort that implies and run it on a strong model.\n\nBasebuilder bundles static analysis, code style, and refactoring in one toolchain from the basebuilder/bb-code-quality package: vendor/bin/bb-quality-fix applies fixes in Rector → ECS → PHPStan order, vendor/bin/bb-quality-check verifies, and the single tools are vendor/bin/bb-phpstan-dry, bb-cs-fix(-dry) and bb-rector(-dry). There are no phpstan.neon, .php-cs-fixer or rector.php files to look for: the configuration lives in that package. Run every quality tool from the host against the worktree, from inside the repository directory, never via docker exec. Two exceptions. The integration tests run inside the fpm container: see the Test suite task. Composer runs only through bb-composer from the service worktree, never the host composer and never with --ignore-platform-reqs, so the lock is resolved against the php version and extensions of CI and production (docs/composer.md)."
order = 5
max_attempts = 3

[[phases.tasks]]
name = "Code quality"
description = "Run the project's code-quality toolchain over the ticket's worktrees: bb-quality-fix first, then bb-quality-check. This one task owns three concerns. Static analysis (PHPStan): the task fails if it reports any error. Code style (ECS): fix and re-run until clean. Automated refactor/modernization (Rector): apply and re-run until clean."
ai_description = "Static analysis (PHPStan), code style (ECS) and refactoring (Rector) are bundled into Basebuilder's bb-quality toolchain, so this one task owns all three. Run all commands from inside the repo directory (`cd` to it first) — Rector fails silently on the wrong rule set when called from a different working directory.\n\nRun `vendor/bin/bb-quality-fix` to apply all fixes in the correct order (Rector → ECS → PHPStan), then `vendor/bin/bb-quality-check` to verify.\n\nECS (code-style) concern: apply the fixes and re-run bb-quality-fix until bb-quality-check reports no style violations. Do not add suppression comments or skip files to make it pass — fix the actual code.\n\nRector (automated refactor/modernization) concern: apply and re-run until bb-quality-check reports no further Rector changes. Do not skip files or lower a rule to make it pass.\n\nPHPStan (static-analysis) concern: any PHPStan error in the bb-quality-check output fails the task — record it and stop, do not attempt the fix here. Do not raise the baseline or lower the level to make it pass. (bb-quality-fix applies Rector/ECS fixes but does not fix PHPStan logic errors.)"
actor = "agent"
max_attempts = 0
order = 1
model = "haiku"

[[phases.tasks]]
name = "Test suite"
description = "Run the full test suite: the unit tests from the host, the integration tests inside the service's fpm container against the local stack. The task fails on any failing or skipped test."
ai_description = "Two runs per PHP worktree, both required. (1) Unit tests, from the worktree directory with the host PHP: `vendor/bin/bb-phpunit` or `vendor/bin/phpunit tests/Unit`. (2) Integration tests (tests/Integration, where the repository has them): they need the local Docker stack and the worktree's .env names the container hostnames (mariadb, elasticsearch, mongo), so they cannot run from the host. Run them inside the service's fpm container, which mounts the worktree: `docker exec basebuilder-stack-<service>-fpm-1 php vendor/bin/phpunit tests/Integration`; find the container name with `docker ps`. Check first that the stack is up; if it is not, start it from the basebuilder-stack directory with the ticket's docker-compose override and wait until the services accept connections. Integration tests may wipe local test data; that is what the local stack is for. A failing, skipped, or incomplete test in either run fails the task: record it and stop, do not attempt the fix here. Do not delete, skip, or weaken a test to make it pass. A connection error is a failed run, not an acceptable skip: fix the environment and run again."
actor = "agent"
max_attempts = 0
order = 2
model = "haiku"

[[phases.tasks]]
name = "Requirements traceability"
description = "Confirm every requirement entity on the ticket is met by the built code. Judge-only: this task records verdicts and does not fix what it finds."
ai_description = "For each requirement entity on the ticket, find the code and tests that satisfy it and confirm it is actually met. Put the requirement-to-code mapping in this task's result. For each requirement, call mcp__tm__tm_requirement_set with the requirement's id and verification set to \"met\" if the code fully satisfies it, \"unmet\" if it does not, or leave it \"unverified\" only if you genuinely cannot determine the outcome (rare — explain why in the result if this happens). Do this for every requirement before finishing, not just the ones that fail. Any requirement you set to \"unmet\" fails this task — record it and stop, do not attempt the fix here.\n\nThis task stays judge-only inside the Gate: it never self-fixes. An unmet requirement is a requirement-level issue, so record it as an 'ask' question via tm_question_add (the ticket id, this task's id as `task`, the model you are running as `model`, self-contained for a cold reader with your recommendation), end the task REVIEW:, and fail this Gate pass. The fix is a new Implementation task, not an edit made here."
actor = "agent"
max_attempts = 0
order = 3
model = "sonnet"

[[phases.tasks]]
name = "AI code review"
description = "A fresh-context agent of our own reviews the ticket's whole diff for correctness and subtle bugs, architecture and convention adherence, readability and test quality. This runs inside the Gate, before any pull request exists, so our own eyes read the diff first and CodeRabbit's pull-request review comes later."
ai_description = "Review the complete set of changes this ticket made — the diff of each feature branch against its base, across every repository in the workspace — with fresh eyes and no assumption that earlier tasks got it right.\n\nRead the project's own rules first: AGENTS.md, CLAUDE.md, docs/architecture/target-state.md, and the docs/modules/ page for each bounded context the diff touches. Those documents are the authority; existing code may be drift.\n\nHunt what the mechanical Gate tasks structurally cannot:\n- Correctness and subtle bugs. Give every branch, loop, boundary and arithmetic expression its own pass. Feed each new function its degenerate inputs on paper — an empty collection, a zero, a negative number, an inverted range, a value one past a limit, a null — and say what it actually returns. A guard that silently produces a wrong answer instead of failing is the highest-value finding here.\n- Adherence to the documented architecture and conventions, including exception root-cause categories and log levels.\n- Readability and maintainability for someone meeting the code cold.\n- Test quality: does each test assert behaviour a requirement cares about, and would it fail if the logic broke? Tests that mirror the implementation's internals prove nothing.\n\nScope is code this ticket changed. Decide newness with git diff origin/<base>...HEAD, never blame or dates. Pre-existing problems on the base branch are out of scope.\n\nWrite every finding into this task's result grouped by severity, each with file and line, the concrete input or state that triggers it, and what goes wrong. Following this phase's fix-in-place practice: fix the clear-cut ones, commit them, and record what was fixed and what was left. A finding whose fix would change the architecture, an interface other code depends on, or a requirement is not fixed here — store it as an 'ask' question via tm_question_add (the ticket id, this task's id as `task`, the model you are running as `model`, self-contained for a cold reader, with your recommendation) and leave the call to the user. Inside this Gate such a requirement-level or architecture-level finding also fails the pass: end the task REVIEW: and stop, the fix becomes a new Implementation task.\n\nRun the quality tools and test suites from the host afterwards, never via docker exec. Finding nothing is a valid outcome; say so plainly rather than inventing a finding to look thorough."
actor = "agent"
max_attempts = 0
order = 4
model = "opus"

[[phases.tasks]]
name = "Pre-merge checklist"
description = "Work through .claude/commands/pre-merge-check.md item by item. This task runs last in the Gate so it judges the code that will be merged."
ai_description = "Open .claude/commands/pre-merge-check.md in the basebuilder-stack repo, go through every rule, do what it says, record each result, and write the report file it prescribes in the ticket directory. Where the checklist references rules from the architecture document, check against those too. Any failed rule fails the task, also a rule that fails on code older than the ticket: a rule scans what it says it scans, and \"pre-existing\" is not a reason to set a failure aside. A failure that is not the user's call is fixed inline; one that is the user's call is stored as an 'ask' question via tm_question_add and the task ends REVIEW:. Two rules need care: \"No open Flappie issues\" is satisfied when every CodeRabbit comment on the ticket's pull requests has a reply recording its disposition, even without a CODERABBIT_REVIEW.md file; \"Bitbucket pipeline passed\" is checked against the pushed feature branch via the Bitbucket MCP tool as the rule describes, and a branch not yet pushed is pushed first.\n\nThose two rules depend on a pull request that this template opens in the Pull request phase, after the Gate. On a Gate pass where no pull request exists yet, record both rules as \"not yet applicable — no pull request\" rather than as failures, and check them on the Gate re-run that follows any later change, when the pull request does exist. The branch-behind-master rule is not deferred this way: check it on every pass."
actor = "agent"
max_attempts = 0
order = 5
model = "sonnet"

[[phases]]
name = "Pull request"
description = "Open a pull request for every repository the ticket touches and confirm CI is green on each. This step is logistics, not a check: it publishes the code the Gate already approved."
ai_description = "Run this phase only after the Gate phase has completed one clean pass. This step is logistics, not a check, so it sits outside the Gate's retry budget: the phase's max_attempts is 0 and nothing here re-runs the Gate. If CI fails, fix the root cause, return to Implementation when the fix is more than mechanical, re-run the Gate, and come back here. The pull request is the surface the human review and the CodeRabbit improvement round both read, so it must exist before those run."
