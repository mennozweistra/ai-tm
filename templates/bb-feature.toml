description = "Basebuilder feature template covering the full delivery lifecycle across the multi-repo stack: discovery, planning, workspace setup, implementation, quality assurance, AI review, human review, and release. Use this for any Basebuilder feature whose requirements are gathered on the ticket before development begins. It fits the multi-repo workflow: Planning decides which repositories the ticket touches, Setup creates a git worktree for each, and the bb-specific quality tooling (bb-quality-fix, bb-quality-check, bb-phpunit) and external reviews (Gemini, CodeRabbit) run in QA and AI Review. Merging to master and any production deployment are the user's calls."
ai_description = "Work the phases in order; do not start a phase until the previous one is complete. Discovery gathers requirements as requirement entities on the ticket. Planning turns them into an implementation and release plan and decides which repositories the ticket touches. Setup creates a git worktree for each touched repo (interactive prep done before any grind run, since worktree creation needs a git push that a grind helper cannot do). Implementation builds it. QA runs the budgeted mechanical checks (bb-quality-fix/bb-quality-check, bb-phpunit), self-fixing inline, then the Ponytail over-engineering review, and ends with the pre-merge checklist so that checklist judges the code that will actually be merged. AI Review then judges requirements traceability, runs the functional review, runs our own AI code review — the one task whose job is hunting correctness bugs by reading the diff — and then the Gemini and CodeRabbit code reviews, once each. Human Review is the user's and colleagues' sign-off. Release ships it, gated on the user's explicit go-ahead for any shared-state step (merge to master, deploy to production). See each phase for its own rules."

[[phases]]
name = "Discovery"
description = "Work out what the feature must do, and capture it as requirement entities on the ticket. This phase runs before Planning: it produces the specification that Planning turns into work. The requirements it produces are displayed in the ticket's Requirements section, not inside this phase."
ai_description = "Discovery is the requirements-gathering process. Its output is the ticket's requirement entities (the standing specification); the phase produces them but does not contain them, the same way Implementation produces code that lives in the repo. Run the tasks in this phase in order. Do not proceed to Planning until Discovery's questioning step has happened or the user has explicitly declined it. Do not start planning or implementation from inside this phase."
order = 1
max_attempts = 0

[[phases.tasks]]
name = "Brainstorm and capture the requirements"
description = "Talk through what the feature should do. This is the open, human-led part — you lead the conversation, the AI listens and sharpens. As each requirement becomes clear, it is captured as a requirement entity on the ticket."
ai_description = "This is the human-led, free-form half of gathering requirements. The user drives an open conversation about what the feature must do; your job is to listen, reflect back, sharpen, and capture each requirement that emerges as a requirement entity on the ticket via tm_requirement_add. Write each requirement as a discrete, individually verifiable statement. Do not start planning or implementation. Do not rush ahead — capture, do not build.\n\nBB reminder: if a requirement involves an interactive control (toggle, drag, custom click/touch/pointer handler), capture touch-input parity (\"identical behaviour on touch input as on mouse\") as its own explicit, individually verifiable requirement line — do not leave it implied by the general behaviour requirement (BBDEV-2320: a fix verified only on mouse shipped broken on touch)."
actor = "human"
max_attempts = 0
order = 1

[[phases.tasks]]
name = "Run a grill session to close the gaps"
description = "The AI now asks questions, each with a recommended answer, to surface the decisions, edge cases, and boundaries the free-form conversation missed. Light questions, where the architecture or the code already points to one clear answer, come as one numbered batch: reply with the numbers you want to discuss and the rest are accepted. Questions whose answer genuinely shapes the design come one per turn. Requirements are added or sharpened as the answers come in."
ai_description = "Call `tm_grill` with the ticket id and follow the protocol it returns. Do not improvise a question sequence from memory — the protocol is the only correct entry point for this interview. The tool will guide you through reading the ticket, exploring the codebase in a sub-agent, conducting the interview in two gears — light questions in one numbered batch the user can accept or pick from, heavy questions one per turn, each with a recommended answer — storing every question as a question entity the moment it is presented and resolving it in the same turn the user answers, and writing requirements live as alignment is reached. The interview closes once requirements are settled."
actor = "agent"
max_attempts = 0
order = 2
model = "sonnet"

[[phases.tasks]]
name = "Devil's Advocate review"
description = "Review the requirements captured on the ticket for gaps, contradictions, or ambiguity. Deliberately consider alternative interpretations or scope boundaries that were not considered. For each gap or ambiguity found, evaluate how it should be resolved. A finding that would change what gets built is repaired in the requirements; anything smaller is noted, not repaired. The review runs once per attempt — grind's retry budget drives any confirming re-run. Flag any unresolved trade-offs or genuinely ambiguous decisions for the human to decide."
ai_description = "Run this review in a fresh sub-agent, not in the current context — instruct it to fetch the requirements captured so far itself via tm_requirement_list (and the ticket via tm_ticket_show for context) rather than passing them as a chat dump, so its critique is not biased by the reasoning that produced them. Have it challenge the requirements: what gaps, contradictions, or ambiguities remain? Are there alternative interpretations of scope that were not considered? For each issue it identifies, it should write a short comparison of the alternatives. Repair the requirements via tm_requirement_add / tm_requirement_set only for a finding that would change what gets built: a wrong fact an implementer would build from, a contradiction between requirements, a missing requirement whose absence changes scope. A finding below that bar — wording, structure, polish — goes into the review narrative (or a question, if it deserves the user's eye) and is not repaired. You run exactly once: grind's retry budget decides whether a confirming pass follows, so do not loop yourself.\n\nDo not write the findings to a markdown file. Return the full reasoning narrative — the gaps and ambiguities considered, the comparisons, and the reasoning for the final verdict — as this task's summary, so it is stored in the task's ai_result field and stays searchable in the database; keep the first line a concise summary for the result field. Every unresolved trade-off or genuinely ambiguous decision the review flags for the human — one it cannot settle itself by sharpening the requirements — is stored as a question entity via tm_question_add the moment it arises: kind 'ask', the ticket id, this task's id as `task`, and the model you are running as `model`. Write it self-contained for a cold reader who was not in this review — in plain words, saying when the issue comes up and how it unfolds, inventing no shorthand for things the user never named — and put the resolution you recommend and its reason in `recommendation`. Do not leave such a decision only in the summary or in chat, and do not defer writing it.\n\nBeyond the review and findings work described above, this task also states the assumptions its critique rests on, so the separate verifier task that follows can check them cold. As the sub-agent reasons, it surfaces every assumption its critique depends on — each thing it takes to be true that the ticket does not itself state — and records one log entry per assumption via tm_log_add with type \"assumption\" and task set to THIS task's own id (task-scoped, not ticket- or phase-scoped). It records every assumption, including ones it believes hold, and it does NOT check them itself: the following verifier task checks them cold, because the agent that stated an assumption is the one least able to see that it is false.\n\nEach assumption is one log entry. Its title is the assumption in one line. Its ai_content is prose following this fixed skeleton, in order: the assumption stated verbatim; its kind — \"fact\" (settled by something already in the repository: code, documentation, data, or a requirement already on the ticket) or \"intent\" (settled only by the user, on a point the requirements never specified); what would settle it (a file path, a document, a requirement id, or \"the user\"); the verdict, left as \"unchecked\" here for the verifier to reach; the evidence, if any is already at hand; the repair made, which is none at this stage; who registered it (this sub-agent and the model it ran as); and the pass number, which is 0 for this Devil's Advocate pass."
actor = "agent"
max_attempts = 3
order = 3
model = "opus"

[[phases.tasks]]
name = "Verify the review's assumptions"
description = "Check the assumptions the preceding Devil's Advocate task recorded. A fresh agent reads each assumption cold from the log, classifies it as a fact (settled by the repository) or the user's intent (settled only by the user), checks the fact assumptions — repairing only those whose falsity would change what gets built — and stops the ticket for the user on any intent assumption. A pass after the first confirms the previous pass's repairs. Every verdict is written back as a log entry. Bounded by the task's retry budget."
ai_description = "Run this in a fresh sub-agent. Its job is to check, cold, the assumptions the preceding Devil's Advocate task stated — the agent that stated an assumption is the one least able to see it is false, so a separate agent checks them.\n\nFind the Devil's Advocate task by POSITION, never by name: it is the task immediately preceding this one in this same phase. Task names are template-defined and renamable, so name-matching is fragile — use tm_task_list on this phase and take the task one order position before this one. In this Discovery phase the order is brainstorm, grill, Devil's Advocate, this verifier, so the task immediately before this one is the Devil's Advocate review.\n\nRead the assumption log entries with tm_log_list: read the preceding Devil's Advocate task's entries (task-scoped to that task) and this task's own entries — a previous pass of this verifier may have added some (see the repair rule below). Consider only entries of type \"assumption\". Where more than one entry exists for the same assumption because passes have appended entries, treat the latest entry for that assumption as the current one.\n\nClassify each assumption as one of two kinds:\n- \"fact\" — settled by something already in the repository: code, documentation, data, or a requirement already on the ticket. You check this kind yourself.\n- \"intent\" — settled only by the user, on a point the requirements never specified. You never verify this kind by reasoning and never quietly accept it.\nThe same sentence can be either: a claim already written as a requirement on the ticket is a fact you confirm; the identical sentence stated only as an assumption, that nobody specified, is a guess at the user's intent.\n\nFor each fact assumption, check it yourself against the repository. Repair a falsified assumption only when leaving it would change what gets built; a harmless imprecision is recorded in its verdict entry and left alone. In this Discovery phase the repair is to the requirements: fix them via tm_requirement_add / tm_requirement_set. When a repair rests on a new assumption of your own, write that new assumption as a new \"assumption\" log entry on THIS task (task set to this task's own id), so the next pass — a fresh sub-agent that remembers nothing of this one — checks it cold.\n\nNever guess an intent assumption. The moment you find one, this task fails: make no repair for it, stop, and write this task's result summary beginning with the token FAILED: (the token grind reads), naming the assumption and the exact question the user must answer to settle it. grind then halts the ticket and the user answers. This rule applies here in Discovery exactly as it does in Planning.\n\nRecord every verdict, not only the failures. For each assumption you reach a verdict on, write an \"assumption\" log entry on THIS task with the fixed skeleton below — both the assumptions that held and the ones that did not — so a later cross-ticket analyzer has a baseline as well as the falsified ones.\n\nWrite no markdown findings file. Your findings live only in the assumption log entries and in this task's result field; a second copy in a file would drift from the log.\n\nEach assumption log entry has title = the assumption in one line, type = \"assumption\", task = this task's own id, and ai_content written as prose following this fixed skeleton, in order: the assumption stated verbatim; its kind (\"fact\" or \"intent\"); what would settle it (a file path, a document, a requirement id, or \"the user\"); the verdict (\"verified\", \"falsified\", or \"needs-user\"); the evidence for that verdict; the repair made, if any; who registered it (this sub-agent and the model it ran as); and the pass number.\n\nThis is a self-contained budgeted task. grind's protocol re-runs it under its max_attempts budget — a fresh sub-agent each pass — and a pass after the first confirms the previous pass's repairs rather than re-verifying the whole list (the CHECK BUDGET block in your prompt carries the rule). It ends when a pass repairs nothing or the budget is spent. Do not implement any loop yourself: state this pass's verdicts and repairs and stop."
actor = "agent"
max_attempts = 3
order = 4
model = "opus"

[[phases]]
name = "Planning"
description = "Turn the requirements into an implementation plan and a release plan, and decide which repositories this ticket touches. You may rename the Implementation phase, and you may insert extra phases — but only between Planning and QA."
ai_description = "Produce the Implementation-phase task breakdown and the Release-phase plan, and decide which repositories the ticket touches — the detail on how is in this phase's planning task. Run the tasks in this phase in order; a review task may send the plan back to an earlier task for revision. You may rename the Implementation phase to something feature-specific and you may add extra phases, but any added phase goes after Planning and before QA. Do not proceed to Setup until Planning is complete."
order = 2
max_attempts = 0

[[phases.tasks]]
name = "Plan the implementation and release"
description = "Read the requirements and the project's architecture, then create the Implementation tasks and the Release tasks, each naming the requirement it serves where applicable. Decide which repositories the ticket touches — a repository is touched if the ticket edits files in it, or if it is a local path/workspace dependency (for example a composer.json \"type\": \"path\" entry, or an npm workspace/file: dependency) of a repository being edited, since that dependency needs its own worktree too even though its source is never edited directly. The Release tasks are chosen to fit this project (for example tag and publish, push to a remote, or deploy)."
ai_description = "Inputs: the ticket's feature description and the requirement entities on the ticket. Read the project's architecture document under docs/ first — the plan must fit it; if it can't, store it as an 'ask' question via tm_question_add the moment it arises (kind 'ask', the ticket id, this task's id as `task`, the model you are running as `model`, a cold-reader question in plain words with your recommended resolution in `recommendation`) instead of planning around it. Create each Implementation-phase task with a clear name, a description of the work, and a reference to its source requirement in the description (or \"from the feature description\" if there were no formal requirements). Break the work down for a good implementation, not to mirror the requirement count — split large requirements into several tasks, group trivial ones.\n\nWrite each task at the altitude of intent: what it must achieve, where to look, and which requirement it serves. Do not bake field-level facts into the plan text — a specific the implementer will verify cheaply against the real system (a field name, an endpoint's exact shape, a library detail) belongs to the implementing task's own work, not to the plan, unless a requirement fixes it. A plan that hardcodes such facts turns the later reviews into prose-verification of claims no test can check.\n\nInclude, among the Implementation tasks, a task that creates or updates any documentation the feature changes — the architecture document, README, API docs, and any other docs referenced by the project's AGENTS.md. This covers both editing an existing doc to reflect a change and writing a new doc or section when the feature introduces something with no existing coverage. Place it as the last Implementation task, since it needs to see the complete diff to know what changed. This is not optional busywork: a later QA check will fail the ticket if a documented surface changed without a matching doc update, so an omitted or incomplete documentation task here comes back to Implementation anyway — plan it in up front instead.\n\nIdentify which repositories the ticket touches, for the Setup phase to create a worktree for each. A repository is touched if (a) the ticket edits files in it, or (b) it is a local path/workspace dependency of a repository being edited — check the composer.json (\"repositories\" entries of \"type\": \"path\") or package.json (workspace/\"file:\" dependencies) of every repository from (a) and include any such dependency repos even though the ticket never edits their source directly. In this stack, a service that requires basebuilder/shared-library depends on bb-service-shared this way, so touching such a service always means bb-service-shared needs its own worktree too.\n\nAlso create the Release-phase tasks the same way, choosing the steps that fit this project (for example tag and publish, push to a remote, or deploy), and leave any shared-state step (merge to master, publish, deploy to production) gated on the user's explicit go-ahead.\n\nWhen creating each Implementation task, also set its `model` field: pick the cheapest model capable of doing the task well, judged from that task's own name and description. Use `haiku` for simple, mechanical steps (renames, formatting, single-line config edits, running an existing scripted check). Use `sonnet` for typical implementation or review work needing ordinary engineering judgment — most tasks land here. Use `opus` only where the task's own difficulty genuinely needs it (deep architectural reasoning, ambiguous requirements needing careful synthesis, a step likely to need retries). Pass the picked value as the `model` argument to `tm_task_add` when creating the task, so it does not fall through to grind's own null-model fallback at execution time.\n\nRecord the plan's shape and any decisions in this task's result; put any architectural decision in the architecture document too."
actor = "agent"
max_attempts = 0
order = 1
model = "opus"

