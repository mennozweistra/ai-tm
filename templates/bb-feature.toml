model = "sonnet"

[[phases]]
name = "AI Review"
description = "AI-driven review, judge-only: each task runs once and never loops back through this phase. The requirements traceability check and the functional review record findings and stop. Our own AI code review runs next and is the phase's correctness hunt — it goes first among the code reviews, so our own eyes see the diff before any external tool does. Gemini and the CodeRabbit CLI follow, all three reading the local diff before any pull request exists, and they fix Critical and High findings in place per Basebuilder practice. Only then are the pull requests opened, CI confirmed green, and the CodeRabbit PR review run last."
ai_description = "Run these tasks in order, once each (max_attempts = 0 on the phase and every task). Verify requirements traceability first, then the functional review, then the code reviews.\n\nOur own AI code review comes before every external tool, and it is the only task in the whole template whose job is to hunt correctness bugs by reading the code. Nothing upstream does that: the QA phase runs tools, and the Ponytail review there is complexity-only by design. If this task is skipped or run shallowly, a silent logic bug reaches a reviewer or production, so give it the effort that implies and run it on a strong model.\n\nThe Gemini and CodeRabbit tasks carry Basebuilder's existing wording, which fixes Critical/High findings in place — keep that behaviour.\n\nOn ordering. The three reviews that read the workspace diff directly — our own AI code review, Gemini, and the CodeRabbit CLI — need no pull request, so they all run before the pull requests are opened. Their fixes then land on the branch before anyone else sees it, instead of arriving as churn on an open pull request. Open pull requests must not run until the QA phase's code quality and test suite checks and this phase's requirements traceability check have all passed. Confirm CI is green runs once the pull requests exist, and the CodeRabbit PR review runs last, against green CI.\n\nRoute findings the AI cannot itself resolve as questions via tm_question_add (kind 'ask' for a user call, 'check' for a decision already taken), passing the ticket id, the review task's id as `task`, and the model you are running as `model`, each self-contained for a cold reader with your recommendation."
order = 6
max_attempts = 0

[[phases.tasks]]
name = "Requirements traceability"
description = "Confirm every requirement entity on the ticket is met by the built code."
ai_description = "For each requirement entity on the ticket, find the code and tests that satisfy it and confirm it is actually met. Put the requirement-to-code mapping in this task's result. For each requirement, call mcp__tm__tm_requirement_set with the requirement's id and verification set to \"met\" if the code fully satisfies it, \"unmet\" if it does not, or leave it \"unverified\" only if you genuinely cannot determine the outcome (rare — explain why in the result if this happens). Do this for every requirement before finishing, not just the ones that fail. Any requirement you set to \"unmet\" fails this task — record it and stop, do not attempt the fix here."
