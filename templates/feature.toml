description = "Run the project's static analysis. The task fails if it reports any error."
ai_description = "Run the project's static-analysis command (for a typical PHP project, `composer stan` or `vendor/bin/phpstan analyse`). Any reported error fails the task — record it and stop, do not attempt the fix here. Do not raise the baseline or lower the level to make it pass."
actor = "agent"
max_attempts = 0
order = 1
