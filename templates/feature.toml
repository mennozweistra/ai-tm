name = "Devil's Advocate review"
description = "Review the implementation plan for suboptimal engineering choices. Deliberately consider alternative approaches that were not taken. For each alternative, evaluate its pros and cons against the chosen approach. If a better approach is found, update the plan and repeat this review. Continue until the chosen approach is defensible. Flag any unresolved trade-offs for the human to decide."
