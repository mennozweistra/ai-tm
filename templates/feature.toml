[[phases]]
name = "Release"
description = "Get the finished, reviewed feature out. This phase starts empty; its tasks are planned during Planning to fit the project — for example tag and publish a library, push a local tool to its remote, or deploy a web app to production. Merging to the main branch and any production deployment are the user's calls."
ai_description = "Perform the release tasks that were planned during Planning, in order. Steps that change shared state — merging to the main branch, publishing, deploying to production — are never unprompted; do them only on the user's explicit go-ahead. Documentation updates happen earlier, as the last Implementation task, and are checked in QA before this phase runs — nothing to do here for docs."
order = 8
max_attempts = 0

[[phases.tasks]]
name = "Final commit and push"
description = "Confirm everything is committed and the branch is pushed to the remote: the working tree is clean and nothing local is left behind."
ai_description = "git status clean; all feature changes committed with messages naming the ticket; the branch pushed to the remote (origin). Always applies, every project."
actor = "agent"
max_attempts = 0
order = 1
model = "haiku"

[[phases.tasks]]
name = "Put local dependencies in their published state"
description = "While a ticket runs, a repository may depend on a sibling checkout through a local path or workspace dependency. That state must never reach the main branch: whoever installs the project from main has no such sibling directory. Replace every local dependency with the published form the project documents, run the project's install and its quality gate, and commit. Skip the task with a one-line note when the project has no local dependencies."
ai_description = "Runs before \"Merge to main and push\", because the merge is what would publish the development state.\n\nFind the local dependencies first. In a composer project, look in composer.json for repositories entries of \"type\": \"path\" and for constraints like \"@dev\" on sibling packages. In a node project, look in package.json for workspace entries and for \"file:\" or \"link:\" dependencies. Other ecosystems have their own form (a Python editable install, a Go replace directive in go.mod); read the project's AGENTS.md or its equivalent, which is where the two states and the swap are usually described.\n\nReplace each one with the state the project says it ships. Do not invent that state: it is documented, typically as a VCS or registry repository entry plus a branch or version constraint. Then run the project's install command and its quality gate, and commit the changed manifest and lockfile together on the feature branch.\n\nOne trap to expect: after the swap, the install resolves the dependency from its remote, and the remote may not yet carry this ticket's changes in that sibling package. When the sibling is also part of this ticket, merge and push the sibling repository first, then run the install here. That is why this task sits directly before the merge task and why the merge order follows the dependency order.\n\nThe project's pre-merge checklist usually carries an item asserting this state. That item is only satisfiable after this task has run, so do not treat a failure of it during QA as a defect in the code."
actor = "agent"
max_attempts = 0
order = 2
model = "sonnet"

[[phases.tasks]]
name = "Merge to main and push"
description = "Merge the feature branch into main and push main to the remote. This is a shared-state action — only after the user's explicit go-ahead naming this step, never unprompted."
ai_description = "For each repo the ticket touched with real commits on its feature branch: update the main checkout to the latest main (git pull --ff-only), merge the feature branch into main with a real merge commit (git merge --no-ff, not a rebase or squash, so the ticket's individual commits stay visible in history), and push main to origin. A repo whose worktree was created but never received a commit (a build dependency touched read-only) needs no merge. Do this only after the user gives explicit go-ahead naming this step or the release itself — never automatically, even if earlier steps completed without objection."
actor = "human"
max_attempts = 0
order = 3

[[phases.tasks]]
name = "Deploy or publish if needed"
description = "If this project needs a deployment or a published release, do it. If it does not, mark this task not applicable with a one-line note saying why."
ai_description = "Conditional. A web app deploys to production; a library tags and publishes; a CLI or local tool may need nothing. This task starts generic; it is filled in with the concrete steps for this project, or marked not applicable with a one-line reason. Any shared-state action — deploy to production, publish, merge to the main branch — happens only on the user's explicit go-ahead, never unprompted."
actor = "human"
max_attempts = 0
order = 4

[[phases.tasks]]
name = "Verify the merge and close the ticket"
description = "Confirm the earlier merge task actually landed on main before this ticket is allowed to close."
ai_description = "For every repo this ticket has a worktree for: check whether the ticket's branch has any commits (git log <branch> vs its base). A worktree created but never committed to needs no check — skip it. For every repo with real commits, verify main actually contains them: `git rev-list --count main..<branch>` must be 0 (every commit on the branch is already in main), not just that the earlier 'Merge to main and push' task was marked done — a task can be marked done by mistake without the merge having happened. If a remote exists, also confirm main is not ahead of its pushed state (`git rev-list --count origin/main..main` is 0). If any repo fails either check, do not mark this task done: report FAILED, name the exact repo and branch that is not merged or not pushed, and stop — the ticket must not close until a human completes the actual merge. Only when every touched repo passes does this task close, and with it the ticket."
actor = "agent"
max_attempts = 0
order = 5
model = "haiku"