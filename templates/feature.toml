[[phases]]
name = "Implementation"
description = "Do the work. The tasks here were created by the Planning phase; each names the requirement it serves. Build on a feature branch, follow the project's architecture document, keep the code consistent with what's already there. This phase ships empty in the template — Planning fills it."
ai_description = "Implement the tasks in this phase, in order. Each task names its source requirement — build exactly what that requires, no more. Follow the project's architecture document under docs/; if you hit a situation the architecture doesn't cover, stop and raise it with the user rather than inventing a pattern. Write tests alongside the code per the project's testing conventions. Work on a feature branch. Record what you did, and any decisions taken along the way, in each task's result. If the plan turns out to be wrong, return to Planning rather than improvising. This phase is empty until Planning populates it."
order = 4
max_attempts = 0
tasks = []

[[phases]]
name = "QA"
description = "The budgeted, self-fixing mechanical check-phase: static analysis, code style, the test suite, the architecture check, the refactor check, the documentation check, and the pre-merge checklist — one concern per task so a failure is individually visible. AI Review and Human Review follow, for checks that must never self-fix."
ai_description = "Run the mechanical checks in this phase, in order. Every task's own max_attempts is 0 — the phase itself carries the retry budget (max_attempts = 3, req 296): a failing check is fixed inline and the phase re-runs its full pass until every check is clean or the phase's attempts are spent. Never lower a gate or weaken a test to make a check pass. When a check fixes an issue inline and the fix involved a real choice between reasonable options, record that decision as a 'check' question via tm_question_add — the question states what was hit, and the recommendation is the decision taken — so the user can later confirm it or reverse it. An issue whose only sound fix would create a new requirement or an architecture change is not fixed here: store it as an 'ask' question via tm_question_add and stop, since that call is the user's. Pass the ticket id, the check task's id as `task`, and the model you are running as `model` on every question, and write each self-contained for a cold reader in plain words. This phase does not judge requirements traceability or run any review — those moved to AI Review, which runs once, judge-only, and never self-fixes."
order = 5
max_attempts = 3

