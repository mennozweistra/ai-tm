[[phases.tasks]]
name = "Refactor check"
description = "Check for automated refactor/modernization suggestions; apply and re-run until clean."
ai_description = "Run the refactor-suggestion tool in dry-run mode (for a typical PHP project using Rector, `vendor/bin/rector process --dry-run`). Apply the suggested changes, then re-run until it reports no changes. Then the task is done."
actor = "agent"
max_attempts = 0
order = 5
model = "haiku"

[[phases.tasks]]
name = "Documentation check"
description = "Confirm the documentation this ticket should have updated was actually updated, by comparing the diff against the docs."
ai_description = "Read the ticket's full diff (all commits since the branch diverged from main), across every repo the ticket touched — a ticket may touch more than one repo; check the diff in each. For each change that alters documented behavior — a route or query parameter added/renamed/removed, a public API shape, a CSS class or design-system catalogue entry, an architectural decision, a feature added or removed, a config option — confirm the matching documentation was updated in the same set of commits.\n\nThis toolset keeps documentation in two separate places, and both must be checked:\n1. Each touched repo's own docs: its architecture document (the exact path varies by repo — docs/architecture.md or docs/architecture/architecture.md; check which the repo actually uses), README, API docs, and any other docs referenced by that repo's own AGENTS.md.\n2. The toolset-wide architecture documentation, which lives in the separate ai-toolset-docs repository (ai-toolset-docs/docs/architecture/architecture.md) — this is the source of truth for cross-repo conventions and toolset-wide architecture per the root CLAUDE.md, and is NOT one of the ticket's touched-repo worktrees by default, so check it explicitly even when no worktree was created for it. If the ticket's change affects how repos interact, introduces a mechanism or convention shared across repos, or is otherwise toolset-wide in nature, confirm ai-toolset-docs was updated too, not just the touched repos' own docs.\n\nPut the change-to-documentation mapping in this task's result, one line per changed surface, citing the doc file (naming which of the two locations above) and section that covers it. Any undocumented change fails the task — record it and stop; do not write the missing documentation yourself here, this is a verification-only task."
actor = "agent"
max_attempts = 0
order = 6
model = "sonnet"

[[phases.tasks]]
name = "Pre-merge checklist"
description = "Work through docs/pre-merge-checklist.md item by item."
ai_description = "Open docs/pre-merge-checklist.md, go through every item, do what it says, and record each result. Where the checklist references rules from the architecture document, check against those too. Any failed item fails the task."
actor = "agent"
max_attempts = 0
order = 7
model = "sonnet"

[[phases.tasks]]
name = "Ponytail review"
description = "Review the ticket's diff for over-engineering — unneeded abstractions, dependencies, or code that reinvents something the standard library or an existing dependency already does."
ai_description = "Run the /ponytail-review skill against the ticket's diff (all commits since the branch diverged from main, across every repo the ticket touched). It hunts only complexity, not correctness: reinvented standard library, unneeded dependencies, speculative abstractions, dead flexibility. For a clear-cut finding (a one-line stdlib swap, an unused parameter, a genuinely dead abstraction), apply the fix directly and re-run until clean. For a finding that is a real judgment call — the simplification might change intended behavior, or trades off against a stated requirement — do not force it: record it as a \"check\" question instead and leave the code as is. Zero findings, or only judgment-call findings recorded as questions, both count as clean."
actor = "agent"
max_attempts = 0
order = 8
model = "sonnet"

[[phases]]
name = "AI Review"
description = "AI-driven review, judge-only: each task runs once and never self-fixes. A requirement set to unmet, or a review finding, is recorded and left for a human — it does not loop back through this phase."
ai_description = "Run these tasks in order, once each (max_attempts = 0 on the phase and every task, req 305). Never attempt a fix here, even a small one — repairing a not-met requirement can mean real implementation work, so any fix goes back through Implementation and the pipeline re-runs from QA. Verify requirements traceability first, then the functional review, then the code review.\n\nRoute every finding — 'minor, ignore' is not a disposition. A small finding: stay judge-only (do not fix it here, not even a small fix) and record it as a 'check' question via tm_question_add stating the finding and the intended fix, and saying that the fix task is created only after the run, when the question is processed, and then loops back through Implementation via the traceable-fix path — promise nothing done during the run, since the grind coordinator may not create tasks mid-run. A finding that needs the user's call (for example: fix it before Human Review, or accept the risk): an 'ask' question laying out the options. A finding too big for this ticket: an 'ask' question proposing a new ticket, since a ticket is never created silently. Pass the ticket id, the review task's id as `task`, and the model you are running as `model` on every question, and write each self-contained for a cold reader with your recommendation. A requirement you set to 'unmet' is such a finding — route it the same way."
order = 6
max_attempts = 0

[[phases.tasks]]
name = "Requirements traceability"
description = "Confirm every requirement entity on the ticket is met by the built code."
ai_description = "For each requirement entity on the ticket, find the code and tests that satisfy it and confirm it is actually met. Put the requirement-to-code mapping in this task's result. For each requirement, call mcp__tm__tm_requirement_set with the requirement's id and verification set to \"met\" if the code fully satisfies it, \"unmet\" if it does not, or leave it \"unverified\" only if you genuinely cannot determine the outcome (rare — explain why in the result if this happens). Do this for every requirement before finishing, not just the ones that fail. Any requirement you set to \"unmet\" fails this task — record it and stop, do not attempt the fix here."
actor = "agent"
max_attempts = 0
order = 1
model = "sonnet"

[[phases.tasks]]
name = "AI functional review"
description = "Run the feature and verify it actually works against the requirements: drive the user interface in a real browser and exercise the API endpoints, confirming each requested behaviour functions end to end. Findings go in the result; a functional failure means recording it and stopping here."
ai_description = "Start the application with the project's run/dev command. Exercise the feature end to end against the requirements: drive the user interface in a real browser with Playwright, and call the REST endpoints directly where the feature exposes them. Confirm each requested behaviour actually works when run — not merely that the tests pass. Record what you exercised and the per-requirement outcome in this task's result; a functional failure means recording it and stopping here, not attempting the fix. Leave the application running when you finish. Performed by a clean Claude Code agent now; designed to be delegated later to another AI with browser control."
actor = "agent"
max_attempts = 0
order = 2
model = "sonnet"

[[phases.tasks]]
name = "AI code review"
description = "A fresh-context AI reviews all of this ticket's code changes against the architecture, conventions, and requirements, and reports findings by severity. No fixes are made here — a confirmed issue is recorded and the task stops."
ai_description = "Run a clean-context code review over the complete set of changes made for this ticket (the diff of its commits against the base branch). Read AGENTS.md, CLAUDE.md, and docs/architecture.md first. Review what the mechanical QA tasks cannot: correctness and subtle bugs, adherence to the documented architecture and conventions, readability, maintainability, and test quality. Write the findings grouped by severity into this task's result. Do not fix anything — record a confirmed issue and stop here, not attempting the fix. For now this is performed by a clean Claude Code agent (for example the /code-review command or a dedicated review subagent); it is designed to be delegated later to an external AI reviewer such as CodeRabbit.\n\nReport only what affects correctness, a stated requirement, or a documented architecture rule. A reviewer asked to find gaps will always find some, and chasing them produces defensive code, needless abstraction and tests for cases that cannot happen. Style preferences, speculative improvements and \"could be cleaner\" belong nowhere in the findings.\n"
actor = "agent"
max_attempts = 0
order = 3
model = "sonnet"

[[phases]]
name = "Human Review"
description = "The user's manual sign-off: confirms the feature works as intended and reviews the code. These tasks are for the user — the AI does not complete them."
ai_description = "Leave both tasks in this phase for the user. Do not mark either done on their behalf; wait for the user's own confirmation."
order = 7
max_attempts = 0

[[phases.tasks]]
name = "Human functional review"
description = "The user runs the feature and confirms it does what was requested and feels right. This task is for the user — the AI does not complete it."
ai_description = "Do not mark this task done — it is the user's hands-on check that the feature works and matches intent. For a user interface the user opens it in a browser; for an API the user exercises the endpoints. The application should already be running from an earlier check. Leave this task for the user."
actor = "human"
max_attempts = 0
order = 1

[[phases.tasks]]
name = "Human code review"
description = "The user reviews the implemented code. This task is for the user — the AI does not complete it."
ai_description = "Do not mark this task done — it is the user's review of the code. Leave it for the user."
actor = "human"
