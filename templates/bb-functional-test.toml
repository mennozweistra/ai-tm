description = "Run the colleague's branch and confirm the problem seen in the master baseline is resolved (or, for a new feature, that it works), driving the feature end to end against the requirements and comparing against the baseline. Report-only; leave the application running."
ai_description = "Bring the stack up on the colleague's branch via the ticket's docker override: if master is still running from the reproduce step, `dk stop` first, then `dkstart <ticket-number>` so the affected services serve the worktree code.\n\nFirst, close the before/after loop: repeat the EXACT steps from the reproduce step and confirm the problem is gone — the error no longer occurs, the state is correct, the logs are clean. Cite the concrete after-state against the before-state the baseline recorded (e.g. the queue row now finalizes at status done/response error with no retry chain; no new Rollbar/Elasticsearch errors). If the reproduce step recorded that reproduction was not applicable (new feature), there is no baseline to compare — just verify the feature works.\n\nThen exercise the feature end to end against the requirement entities on the ticket: drive the UI in a real browser with Playwright, and call REST endpoints directly where exposed. If the diff touches a pointerdown/pointerup/click/touch handler, exercise it twice — once with normal mouse interaction and once with Playwright touch emulation (hasTouch: true, isMobile: true, page.tap()) — pointer events fire identically for mouse and touch unless the code branches on event.pointerType (BBDEV-2320). For each requirement entity set verification via tm_requirement_set: met / unmet (or unverified with the reason).\n\nIf a functional check needs local dev configuration the dev environment lacks (for example a variable that exists in production but not in the dev .env), you MAY edit the local dev config files (.env and similar) inside the ticket workspace to make the branch runnable and the fix observable — this is disposable local test setup, not the colleague's code; never edit tracked source, never commit, never push. Fix nothing in the colleague's code itself — a functional failure is a finding for the consolidation task, recorded with its reproduction steps. Leave the application running on the branch when you finish so the user's own hands-on test can start immediately."
