ai_description = "Create the ticket directory following the project's convention (tickets/feature/BBDEV-XXXX-<slug>/, using the colleague's Jira key). For each repository in scope:\n1. git -C <main-clone> fetch\n2. git -C <main-clone> worktree add <ticket-dir>/<repo> <colleague-branch> — this creates a local branch tracking origin/<colleague-branch>; the main clone stays on its default branch.\n3. git -C <worktree> branch -vv — confirm it tracks the colleague's origin branch.\n4. composer install in the worktree, so the service can run from it.\n5. If the main clone has a .env, copy it into the worktree (cp <main-clone>/.env <worktree>/.env).\nNEVER push and NEVER commit from these worktrees — this is a read-only checkout of a colleague's branch. Record each worktree path and its tracking line in this task's result."
