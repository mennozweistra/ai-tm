ai_description = "This step runs on MASTER, not the colleague's branch — the point is to see the problem first, so the verify step has a real \"before\" to compare against.\n\nBring the stack up on master with the base compose and NO ticket override: `dk start` (if a stack is already running on a branch, `dk stop` first). The main clones serve master, so the affected services run the current released code.\n\nFollow the ticket's own test plan / reproduction steps to trigger the reported problem, and record exactly what you observe as the baseline: the error, the wrong state, the relevant logs — for example the queue row's state, the Rollbar / Elasticsearch errors, or the crash. Be concrete; this \"before\" state is what the verify step compares against.\n\nIf the ticket is a new feature with no pre-existing problem to reproduce, do NOT invent one: record that reproduction is not applicable and why (the feature does not exist on master), and proceed to the verify step.\n\nReport-only — never modify, commit, or push. Put the observed baseline in this task's result."
