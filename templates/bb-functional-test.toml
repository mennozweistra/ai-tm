description = "Template for functionally testing a colleague's feature: check their branches out read-only, run the local stack on their code with a Docker override, drive the feature end to end with Playwright (including the touch-parity pass), and hand the user a findings report plus a running application for his own hands-on test. Report-only — no fixes, no commits, no pushes. For a code review, use the code review template."
ai_description = "Work the phases in order. This ticket tests a COLLEAGUE's feature: everything is report-only on the colleague's code — never modify tracked source, commit, or push on their branches, never post to the PR or Jira. Editing disposable local dev config (a .env or similar) inside the ticket workspace IS allowed when it is needed to run the branch and make the fix observable — that is local test setup, not the colleague's code; never commit it and never touch tracked files. Intake captures the scope (Jira ticket, repos, branches, PRs) and the requirements as requirement entities. Setup checks the branches out read-only in worktrees, creates the Docker override, and starts the stack on the colleague's code. The AI functional test drives the feature end to end against the requirements and records per-requirement verdicts. Consolidation turns the findings into a report with draft feedback. The user then tests the feature himself and delivers the feedback."

